<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2958cc">
<link rel="icon" href="icons/icon-192.png">
<title>Timesheet Payroll</title>
<style>
  :root{
    --brand:#2958cc;--brand-dark:#1d3f96;--brand-soft:#e8eefb;--bg:#f2f4f8;--card:#ffffff;--ink:#1c2230;--muted:#667085;--line:#e3e7ef;
    --amber:#8a4b00;--amber-bg:#fdf0dc;--green:#0f6b39;--green-bg:#e3f4ea;--red:#a3241d;--red-bg:#fbe7e5;
    --done:#f1f2f5;--done-ink:#8b93a3;
  }
  *{box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;}
  .hidden{display:none !important;}
  .appbar{background:var(--brand);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
  .appbar img{height:15px;display:block;}
  .appbar .ttl{font-size:15px;font-weight:600;flex:1;padding-left:12px;border-left:1px solid rgba(255,255,255,.4);}
  .appbar .user{font-size:12px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:20px;cursor:pointer;border:0;color:#fff;}
  .appbar .user:hover{background:rgba(255,255,255,.28);}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 22px 70px;}
  h1{font-size:22px;font-weight:600;margin:0;}
  h2{font-size:15px;font-weight:600;margin:26px 0 10px;}
  .meta{color:var(--muted);font-size:13px;line-height:1.5;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;}
  .btn:hover{border-color:#c3cad8;background:#fafbfd;}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-dark);}
  .btn.done{background:var(--green-bg);border-color:#bfe3cc;color:var(--green);}
  .btn.small{padding:5px 10px;font-size:12.5px;border-radius:7px;}
  .btn.link{border:0;background:none;color:var(--brand);padding:4px 2px;}
  .btn:disabled{opacity:.5;cursor:default;}
  select,input,textarea{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid #bcd0f6;border-color:var(--brand);}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .grow{flex:1;}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap;}
  .p-approved{background:var(--green-bg);color:var(--green);}
  .p-waiting,.p-senior{background:var(--amber-bg);color:var(--amber);}
  .p-sentback,.p-missing{background:var(--red-bg);color:var(--red);}
  .p-info{background:var(--brand-soft);color:var(--brand-dark);}
  .p-done{background:var(--done);color:#5d6575;}
  .bar{height:7px;background:#e7eaf0;border-radius:6px;overflow:hidden;}
  .bar>i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .25s;}
  /* home */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:16px;}
  .sitecard{cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .sitecard:hover{border-color:#b6c3df;box-shadow:0 2px 10px rgba(30,50,100,.07);}
  .sitecard .nm{font-size:17px;font-weight:700;}
  .sitecard .big{display:flex;gap:22px;margin:14px 0 12px;}
  .sitecard .big b{display:block;font-size:20px;font-weight:600;}
  /* week */
  .head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0 4px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;}
  .tile .l{font-size:12px;color:var(--muted);}
  .tile .v{font-size:23px;font-weight:600;margin:3px 0 0;}
  .tile .bar{margin-top:9px;}
  .banner{border-radius:10px;padding:10px 14px;font-size:13.5px;margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .banner.ok{background:var(--green-bg);color:var(--green);}
  .banner.warn{background:var(--amber-bg);color:var(--amber);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .chip .n{opacity:.7;margin-left:4px;font-weight:500;}
  .search{width:220px;}
  /* outstanding */
  .tablewrap{border:1px solid var(--line);border-radius:12px;overflow-x:auto;background:#fff;}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:9px 12px;font-size:13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child>td{border-bottom:0;}
  th{font-size:11.5px;color:var(--muted);font-weight:700;background:#fafbfd;white-space:nowrap;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* people */
  .person{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:background .2s;}
  .person .top{display:grid;grid-template-columns:minmax(190px,1.4fr) auto minmax(250px,2fr) 70px 150px;gap:14px;align-items:center;padding:12px 16px;cursor:pointer;}
  .person .top:hover{background:#f8faff;}
  .person.open .top{background:#f4f7fd;border-bottom:1px solid var(--line);}
  .av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:0 0 auto;}
  .who{display:flex;gap:10px;align-items:center;min-width:0;}
  .who b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .days div{text-align:center;font-size:12px;border-radius:6px;padding:4px 0;background:#f5f7fa;font-variant-numeric:tabular-nums;}
  .days div small{display:block;font-size:10px;color:var(--muted);}
  .days div.lv{background:var(--brand-soft);color:var(--brand-dark);font-weight:700;}
  .days div.zero{color:#b2b8c4;}
  .tot{font-size:16px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
  .act{text-align:right;}
  .person.alldone{background:var(--done);}
  .person.alldone .top{opacity:.72;}
  .person.alldone .av{background:#dde1e8;color:#6b7383;}
  .person.alldone .days div{background:#e7e9ee;}
  .person .body{padding:12px 16px 16px;background:#fbfcfe;}
  .lines td{font-size:13px;background:#fff;}
  .lines input.hr{width:74px;text-align:right;padding:5px 7px;}
  .lines input.tx{width:100%;min-width:130px;padding:5px 8px;}
  .lines tr.isdone td{background:var(--done);color:var(--done-ink);}
  .lines tr.isdone td .pill{opacity:.8;}
  .lines tr.removed td{text-decoration:line-through;color:#a3a9b5;}
  .lines tr.adding td{background:#f4f8ff;}
  .tick{width:18px;height:18px;cursor:pointer;accent-color:var(--green);}
  .by{font-size:11.5px;color:var(--done-ink);}
  .tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;border-radius:10px;padding:1px 7px;background:var(--amber-bg);color:var(--amber);margin-left:5px;}
  .editbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px;padding:10px 12px;border:1px dashed #cfd6e4;border-radius:10px;background:#fff;}
  .editbar b{font-size:13px;}
  .log{font-size:12px;color:var(--muted);margin-top:12px;}
  .log div{padding:2px 0;}
  .gate{max-width:420px;margin:80px auto;text-align:center;}
  .err{color:var(--red);font-size:13px;margin-top:10px;}
  .empty{padding:30px;text-align:center;color:var(--muted);}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1c2230;color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .tabs{display:flex;gap:4px;margin:0 0 18px;border-bottom:1px solid var(--line);}
  .tabs button{border:0;background:none;padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tabs button.on{color:var(--brand);border-bottom-color:var(--brand);}
  .finder{position:relative;flex:1;min-width:260px;max-width:460px;}
  .finder input{width:100%;padding:10px 12px;font-size:14.5px;}
  .sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,60,.12);max-height:340px;overflow:auto;z-index:30;}
  .sugg button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 12px;text-align:left;cursor:pointer;font-size:13.5px;}
  .sugg button:hover,.sugg button.hi{background:#f1f5fd;}
  .sugg .meta{margin-left:auto;font-size:12px;}
  .profile{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .profile .av{width:52px;height:52px;font-size:17px;}
  .kv{display:flex;gap:26px;flex-wrap:wrap;margin-top:4px;}
  .kv div span{display:block;font-size:12px;color:var(--muted);}
  .kv div b{font-size:14px;font-weight:600;}
  .wk{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .wk .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;}
  .wk .top:hover{background:#f8faff;}
  .wk.open .top{background:#f4f7fd;border-bottom:1px solid var(--line);}
  .wk .top .rng{font-weight:700;font-size:14.5px;min-width:190px;}
  .wk .body{padding:12px 16px 16px;background:#fbfcfe;}
  .full td{font-size:12.5px;vertical-align:top;}
  .full .sub{font-size:11.5px;color:var(--muted);}
  .hist{font-size:11.5px;color:var(--muted);padding:2px 0 0 0;}
  .hist li{margin:1px 0;}
  /* week: People / Allowances switch */
  .seg{display:inline-flex;background:#e9edf4;border-radius:10px;padding:3px;gap:2px;}
  .seg button{border:0;background:none;padding:7px 16px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.12);}
  /* allowances */
  .atiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 14px;}
  .atile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;border-top:3px solid var(--k);}
  .atile b{display:block;font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;}
  .atile .nm{font-size:13px;font-weight:600;margin-top:3px;}
  .atile .kd{font-size:11px;color:var(--muted);}
  .k-daily{--k:#2958cc;} .k-job{--k:#c26a00;} .k-weekly{--k:#0f7a55;} .k-shift{--k:#7a5af5;}
  .shiftrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px;font-size:13px;}
  .sh{display:inline-block;background:#f0ecfe;color:#4b36a8;border-radius:14px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;margin:1px 2px 1px 0;}
  .sh i{font-style:normal;opacity:.7;font-weight:500;margin-left:3px;}
  .atable th.grp{text-align:center;font-size:11px;letter-spacing:.3px;text-transform:uppercase;border-bottom:3px solid var(--k);background:#fff;}
  .atable th.col{text-align:center;white-space:normal;min-width:92px;max-width:140px;line-height:1.25;}
  .atable td.c{text-align:center;font-variant-numeric:tabular-nums;}
  .atable td.c b{font-size:16px;}
  .atable td.c small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;}
  .atable td.c .w{display:block;font-size:10.5px;color:var(--amber);font-weight:700;}
  .atable td.c.none{color:#c8cdd6;}
  .atable td.nm{position:sticky;left:0;background:#fff;z-index:1;min-width:170px;}
  .atable th:first-child{position:sticky;left:0;z-index:2;}
  .atable td.nm button{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;}
  .atable td.nm button:hover{color:var(--brand);text-decoration:underline;}
  .atable tr.isdone td{background:var(--done);color:var(--done-ink);}
  .atable tr.isdone td .sh{background:#e4e6ec;color:#6b7383;}
  .atable tr.tot td{background:#f5f7fb;font-weight:700;border-top:2px solid var(--line);}
  .atable tr.tot td.nm{background:#f5f7fb;}
  .printonly{display:none;}
  @media print{
    .printonly{display:block;}
    .atable td.nm,.atable th:first-child{position:static;}
    .appbar,.tabs,.noprint,#toast{display:none !important;}
    body{background:#fff;}
    .wrap{padding:0;max-width:none;}
    .wk{break-inside:avoid;border-color:#ccc;}
    .wk .body{display:block !important;}
  }
  @media (max-width:900px){
    .person .top{grid-template-columns:1fr auto;}
    .person .top .days{grid-column:1 / -1;order:3;}
    .person .top .tot{order:2;}
    .person .top .act{grid-column:1 / -1;order:4;text-align:left;}
  }
  @media (max-width:640px){ .wrap{padding:14px 12px 60px;} .appbar{padding:10px 12px;} .search{width:100%;} }
</style>
</head>
<body>
<div class="appbar">
  <img src="icons/ael-logo-white.svg" alt="Airport Equipment">
  <div class="ttl">Timesheet payroll</div>
  <button class="user hidden" id="who" onclick="signOut()"></button>
</div>

<div class="gate" id="gate">
  <div class="card">
    <h1>Payroll</h1>
    <p class="meta">Sign in with your AEL Microsoft 365 account.</p>
    <button class="btn primary" onclick="signIn()">Sign in with Microsoft</button>
    <div class="err" id="signErr"></div>
    <p class="meta hidden" id="newTab" style="margin-top:14px">Sign-in blocked here? <a href="" target="_blank" rel="noopener" id="newTabLink">Open payroll in a new tab</a></p>
  </div>
</div>

<div class="gate hidden" id="noAccess">
  <div class="card">
    <h1>No payroll access</h1>
    <p class="meta" id="noAccessText"></p>
  </div>
</div>

<div class="wrap hidden" id="app">
  <div class="tabs">
    <button id="tabWeeks" class="on" onclick="goHome()">Pay weeks</button>
    <button id="tabEmp" onclick="goEmp()">Employees</button>
  </div>
  <!-- home: every site's pay week -->
  <div id="home">
    <div class="head">
      <div class="grow"><h1>Pay weeks</h1><div class="meta">Pick a site to check and process its week.</div></div>
      <select id="homeWeeks" onchange="loadHome()">
        <option value="1">Last finished week</option>
        <option value="0">Current week</option>
        <option value="2">2 weeks ago</option>
        <option value="3">3 weeks ago</option>
      </select>
      <button class="btn" onclick="loadHome()">↻ Refresh</button>
    </div>
    <div class="grid" id="siteCards"><div class="meta">Loading…</div></div>
  </div>

  <!-- one site's week -->
  <div id="week" class="hidden">
    <button class="btn link noprint" onclick="goHome()">← All sites</button>
    <div class="head" style="margin-top:6px">
      <div class="grow">
        <h1 id="weekTitle"></h1>
        <div class="row noprint" style="margin-top:8px">
          <select id="siteSel" onchange="pickSite()"></select>
          <button class="btn small" onclick="stepWeek(1)" aria-label="Earlier week">◀</button>
          <select id="weekSel" onchange="pickWeek()"></select>
          <button class="btn small" onclick="stepWeek(-1)" aria-label="Later week">▶</button>
        </div>
      </div>
      <div class="row noprint">
        <button class="btn" onclick="download('xlsx')">⤓ Excel</button>
        <button class="btn" onclick="download('pdf')">⤓ PDF</button>
        <button class="btn primary" id="procBtn" onclick="processWeek()">Process all approved</button>
      </div>
    </div>
    <div id="weekBody"><div class="meta" style="margin-top:20px">Loading…</div></div>
  </div>

  <!-- one employee's timesheets, past or present -->
  <div id="emp" class="hidden">
    <div class="head noprint">
      <select id="empSite" onchange="siteFilterChanged()" title="Only show people at this site">
        <option value="">All sites</option>
      </select>
      <div class="finder">
        <input id="empSearch" placeholder="Search for an employee or contractor" autocomplete="off"
          oninput="suggest(this.value)" onfocus="suggest(this.value)" onkeydown="suggestKey(event)">
        <div class="sugg hidden" id="sugg"></div>
      </div>
      <select id="empRange" onchange="rangeChanged()">
        <option value="4">Last 4 weeks</option>
        <option value="12" selected>Last 12 weeks</option>
        <option value="26">Last 6 months</option>
        <option value="52">Last 12 months</option>
        <option value="week">One pay week…</option>
        <option value="custom">Between dates…</option>
      </select>
      <input type="date" id="empDate" class="hidden" onchange="loadEmp()" title="Any day in the pay week">
      <input type="date" id="empFrom" class="hidden" onchange="loadEmp()">
      <input type="date" id="empTo" class="hidden" onchange="loadEmp()">
    </div>
    <div id="empBody" style="margin-top:18px"><div class="card empty">Search for someone to see their timesheets — any week, past or present.</div></div>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
<script src="config.js"></script>
<script>
const APP_VERSION='1.4';
const SCOPES=['openid','profile','email'];
const IN_FRAME=(()=>{ try{ return window.self!==window.top; }catch(_){ return true; } })();
let msalInstance=null, account=null, ME=null, WEEK=null, OPEN=new Set(), EDIT=null, FILTER='all', QUERY='', BUSY=false, VIEW='people', INCL_WAIT=false;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
const js=s=>esc(JSON.stringify(String(s)));   // a string literal safe inside an onclick="…"
function fmtHr(n){const v=Math.round((Number(n)||0)*100)/100;return Number.isInteger(v)?v.toFixed(1):String(v);}
function dayLabel(d){return new Date(d+'T00:00:00Z').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});}
function shortDay(d){return new Date(d+'T00:00:00Z').toLocaleDateString('en-AU',{weekday:'short',timeZone:'UTC'});}
function weekLabel(ws,we){return dayLabel(ws)+' – '+dayLabel(we);}
function addDays(d,n){return new Date(Date.parse(d+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);}
function initials(n){const p=String(n||'').trim().split(/\s+/);return ((p[0]||'')[0]||'').toUpperCase()+((p.length>1?p[p.length-1]:'')[0]||'').toUpperCase();}
function whenLabel(w){ if(!w) return ''; const d=new Date(w.replace(' ','T')+':00Z'); return isNaN(d)?w:d.toLocaleString('en-AU',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }
const STATUS={approved:'Approved',waiting:'Waiting for approval',senior:'Waiting for senior',sentback:'Sent back',missing:'Not submitted'};
const pill=(cls,txt)=>`<span class="pill p-${cls}">${esc(txt)}</span>`;
const L_OK=l=>l.status==='Approved'||l.status==='Acknowledged';

/* ---------- Microsoft sign-in (a pop-up when shown inside SharePoint, which won't let sign-in load in a frame) ---------- */
(async function init(){
  // On au-payroll.ael.co the sign-in pop-up comes back to this page: leave it for the page that opened it.
  if(window.opener && window.opener!==window && /^msal\./.test(window.name||'')) return;
  const cfg=window.SUP_CONFIG||{};
  document.getElementById('newTabLink').href=location.href;
  if(IN_FRAME) document.getElementById('newTab').classList.remove('hidden');
  try{
    msalInstance=new msal.PublicClientApplication({
      auth:{ clientId:cfg.clientId, authority:'https://login.microsoftonline.com/'+cfg.tenantId, redirectUri:window.location.origin },
      cache:{ cacheLocation:'localStorage' }
    });
    await msalInstance.initialize();
    const resp=IN_FRAME?null:await msalInstance.handleRedirectPromise();
    account=(resp&&resp.account)||msalInstance.getAllAccounts()[0]||null;
    if(account){ msalInstance.setActiveAccount(account); start(); }
  }catch(e){ document.getElementById('signErr').textContent='Sign-in error — try again.'; }
})();
async function signIn(){
  if(!msalInstance) return;
  document.getElementById('signErr').textContent='';
  try{
    if(IN_FRAME){
      const r=await msalInstance.loginPopup({ scopes:SCOPES });
      account=r.account; msalInstance.setActiveAccount(account); start();
    }else await msalInstance.loginRedirect({ scopes:SCOPES, redirectStartPage:location.href });
  }catch(e){ document.getElementById('signErr').textContent=/popup/i.test(String(e&&(e.errorCode||e.message)))?'Your browser blocked the sign-in window — allow pop-ups for this page, or open payroll in a new tab.':'Couldn’t sign in — try again.'; }
}
function signOut(){ if(!msalInstance||!account) return; if(IN_FRAME) msalInstance.logoutPopup({account}).then(()=>location.reload()).catch(()=>{}); else msalInstance.logoutRedirect({account}); }
async function getToken(force){
  try{
    let res=await msalInstance.acquireTokenSilent({ account, scopes:SCOPES, forceRefresh:!!force });
    const exp=((res.idTokenClaims||{}).exp||0)*1000;
    if(!force&&exp&&exp-Date.now()<5*60000) res=await msalInstance.acquireTokenSilent({ account, scopes:SCOPES, forceRefresh:true });
    return res.idToken;
  }catch(e){
    if(IN_FRAME){ const r=await msalInstance.acquireTokenPopup({ scopes:SCOPES, account }); return r.idToken; }
    msalInstance.loginRedirect({ scopes:SCOPES, loginHint:account&&account.username, redirectStartPage:location.href }).catch(()=>{});
    throw new Error('Signing you in again…');
  }
}
async function api(body){
  const send=t=>fetch('/.netlify/functions/payroll',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify(body)});
  let res=await send(await getToken(false));
  if(res.status===401) res=await send(await getToken(true));
  const j=await res.json().catch(()=>({ok:false,error:'server'}));
  if(!res.ok||!j.ok) throw new Error(j.error&&j.error!=='server'?j.error:'Something went wrong — try again.');
  return j;
}

/* ---------- start ---------- */
async function start(){
  document.getElementById('gate').classList.add('hidden');
  const chip=document.getElementById('who'); chip.classList.remove('hidden');
  chip.textContent=((account.name||'').split(' ')[0]||'Signed in')+' · Sign out';

  if(!ME.admin){
    document.getElementById('noAccess').classList.remove('hidden');

  }

  else if(q.get('site')&&ME.sites.some(s=>s.name===q.get('site'))) openWeek(q.get('site'),q.get('week')||'');

}
window.addEventListener('hashchange',()=>{

});

/* ---------- home ---------- */
function showView(v){

function goHome(){ if(!leaveEdits()) return; if(location.hash) history.pushState(null,'',location.pathname+location.search); showHome(); }
function showHome(){ showView('home'); WEEK=null; EDIT=null; loadHome(); }

          ${m.waiting?pill('waiting',m.waiting+' waiting'):''}${m.sentback?pill('sentback',m.sentback+' sent back'):''}${m.missing?pill('missing',m.missing+' not submitted'):''}

/* ---------- one site's week ---------- */
function siteWeeks(site){ return ((ME.sites.find(s=>s.name===site)||{}).weeks)||[]; }
function openWeek(site,weekStart){
  const weeks=siteWeeks(site);
  if(!weekStart) weekStart=(weeks[1]||weeks[0]||{}).weekStart;
  showView('week');
  document.getElementById('siteSel').value=site;
  fillWeeks(site,weekStart);
  const h='#site='+encodeURIComponent(site)+'&week='+weekStart;
  if(location.hash!==h) history.pushState(null,'',h);
  loadWeek(site,weekStart);
}
function fillWeeks(site,weekStart){
  const weeks=siteWeeks(site).slice();
  if(weekStart&&!weeks.some(w=>w.weekStart===weekStart)) weeks.push({weekStart,weekEnd:addDays(weekStart,6)});
  document.getElementById('weekSel').innerHTML=weeks.map(w=>`<option value="${w.weekStart}"${w.weekStart===weekStart?' selected':''}>${weekLabel(w.weekStart,w.weekEnd)}${w.current?' (current)':''}</option>`).join('');
}
function pickSite(){ if(!leaveEdits()) return; const s=document.getElementById('siteSel').value; const w=siteWeeks(s); openWeek(s,(w[1]||w[0]).weekStart); }
function pickWeek(){ if(!leaveEdits()) return; openWeek(document.getElementById('siteSel').value,document.getElementById('weekSel').value); }
function stepWeek(dir){ const sel=document.getElementById('weekSel'); const i=sel.selectedIndex+dir; if(i>=0&&i<sel.options.length){ sel.selectedIndex=i; pickWeek(); } }

async function loadWeek(site,weekStart,keepOpen){
  const body=document.getElementById('weekBody');
  if(!keepOpen){ body.innerHTML='<div class="meta" style="margin-top:20px">Loading…</div>'; OPEN=new Set(); }
  document.getElementById('weekTitle').textContent=site;
  EDIT=null;
  try{ WEEK=await api({action:'week',site,weekStart}); renderWeek(); }
  catch(e){ body.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
function weekDays(){ return Array.from({length:7},(_,i)=>addDays(WEEK.weekStart,i)); }

/* processed counts, recomputed in the page after a tick so it doesn't need a reload */
function approvedLines(p){ return p.lines.filter(l=>l.status==='Approved'); }
function personState(p){ const ap=approvedLines(p), d=ap.filter(l=>l.processed).length; return {total:ap.length,done:d,all:ap.length>0&&d===ap.length}; }
function weekState(){
  let total=0,done=0;
  for(const p of WEEK.people){ const s=personState(p); total+=s.total; done+=s.done; }
  return {total,done};
}
function matches(p){
  if(QUERY&&!p.name.toLowerCase().includes(QUERY)) return false;
  const s=personState(p);
  if(FILTER==='todo') return s.total>s.done;
  if(FILTER==='done') return s.all;
  if(FILTER==='out') return p.status!=='approved';
  return true;
}

function renderWeek(){
  const w=WEEK, m=w.summary, ws=weekState();
  const out=w.people.filter(p=>p.status!=='approved');
  const pct=ws.total?Math.round(ws.done/ws.total*100):0;
  const btn=document.getElementById('procBtn');
  btn.textContent=ws.total&&ws.done===ws.total?'↺ Reopen week':'✓ Process all approved';
  btn.className='btn '+(ws.total&&ws.done===ws.total?'':'primary');
  btn.disabled=!ws.total;
  let html=`<div class="tiles">
    <div class="tile"><div class="l">Approved hours</div><div class="v">${fmtHr(m.approvedHours)}</div></div>
    <div class="tile"><div class="l">People approved</div><div class="v">${m.approved} <span class="meta">of ${m.people}</span></div></div>
    <div class="tile"><div class="l">Still outstanding</div><div class="v" style="color:${out.length?'var(--red)':'var(--green)'}">${out.length}</div></div>
    <div class="tile"><div class="l">Leave hours</div><div class="v">${fmtHr(m.leaveHours)}</div></div>
    <div class="tile"><div class="l">Processed</div><div class="v">${ws.done} <span class="meta">of ${ws.total} lines</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
  </div>`;
  if(ws.total&&ws.done===ws.total) html+=`<div class="banner ok">✓ Everything approved this week is processed${w.processed.by?` — last by ${esc(w.processed.by)}`:''}.</div>`;
  else if(ws.done) html+=`<div class="banner warn">${ws.total-ws.done} approved line${ws.total-ws.done===1?' is':'s are'} still to process. Use the <b>To process</b> filter to find them.</div>`;

  if(out.length){
    const emails=out.map(p=>p.email).filter(Boolean);
    html+=`<h2>Outstanding <span class="meta">(${out.length})</span></h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Type</th><th>Status</th><th class="num">Hours so far</th><th class="num">${emails.length>1?`<a class="btn small" href="${chaseLink(emails)}">✉ Email all ${emails.length}</a>`:''}</th></tr></thead><tbody>
      ${out.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td class="meta">${esc(p.type||'')}</td><td>${pill(p.status,STATUS[p.status])}${p.status==='sentback'&&reasonOf(p)?` <span class="meta">${esc(reasonOf(p))}</span>`:''}</td><td class="num">${p.lines.length?fmtHr(p.total):'<span class="meta">–</span>'}</td>
        <td class="num">${p.email?`<a class="btn small" href="${chaseLink([p.email],p)}">✉ Email</a>`:'<span class="meta">no email</span>'}</td></tr>`).join('')}
      </tbody></table></div><div class="meta" style="margin-top:6px">Email opens a ready-written message in Outlook. Nothing is sent until you send it.</div>`;
  }

  const counts={all:w.people.length,todo:w.people.filter(p=>{const s=personState(p);return s.total>s.done;}).length,done:w.people.filter(p=>personState(p).all).length,out:out.length};
  const chip=(k,t)=>`<button class="chip${FILTER===k?' on':''}" onclick="setFilter('${k}')">${t}<span class="n">${counts[k]}</span></button>`;
  const seg=`<div class="seg noprint"><button class="${VIEW==='people'?'on':''}" onclick="setView('people')">People</button><button class="${VIEW==='allow'?'on':''}" onclick="setView('allow')">Allowances</button></div>`;
  if(VIEW==='allow'){
    html+=`<div class="row noprint" style="margin:26px 0 14px">${seg}<span class="grow"></span>
      <label class="meta" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" class="tick" ${INCL_WAIT?'checked':''} onchange="INCL_WAIT=this.checked;renderWeek()"> Include not yet approved</label>
      <button class="btn small" onclick="window.print()">⎙ Print</button></div>
      <div id="allow">${allowHtml()}</div>`;
    document.getElementById('weekBody').innerHTML=html;
    return;
  }
  html+=`<div class="row" style="margin:26px 0 12px">${seg}<span class="grow"></span>
    <div class="chips">${chip('all','All')}${chip('todo','To process')}${chip('done','Processed')}${chip('out','Outstanding')}</div>
    <input class="search" id="search" placeholder="Search name" value="${esc(QUERY)}" oninput="QUERY=this.value.trim().toLowerCase();renderPeople()">
  </div><div id="people"></div>
  <datalist id="allowList">${(w.allowances||[]).map(a=>`<option value="${esc(a)}">`).join('')}</datalist>`;
  document.getElementById('weekBody').innerHTML=html;
  renderPeople();
}
function setView(v){ if(v!==VIEW&&!leaveEdits()) return; if(v!==VIEW) EDIT=null; VIEW=v; renderWeek(); }

/* ---- allowances: who gets what this week ----
   Daily / weekly allowances are lines of their own; per-job ones (Call-out) are ticks on an
   hours line; the shift worked is counted once a day. Approved lines count; with "Include not
   yet approved" the rest show as "+n waiting". Sent-back lines never count. */
const KIND={daily:'Per shift / day',job:'Per job',weekly:'Weekly'}, KIND_ORDER={daily:0,job:1,weekly:2};
function allowData(){
  const kinds=WEEK.allowanceKinds||{}, jobs=new Set(), rows=[];
  for(const p of WEEK.people){
    const r={p,cells:{},shifts:{},waitShifts:{},any:false,state:personState(p)};
    const seenDay={};
    for(const l of p.lines){
      if(l.status==='Rejected') continue;
      const ok=l.status==='Approved';
      if(!ok&&!INCL_WAIT) continue;
      const add=k=>{ const c=r.cells[k]||(r.cells[k]={n:0,wait:0,days:[]}); ok?c.n++:c.wait++; c.days.push(l.date); r.any=true; };
      if(l.allow) add(l.allow);
      else{
        for(const j of l.jobs||[]){ jobs.add(j); add(j); }
        if(l.shift&&!seenDay[l.date]){ seenDay[l.date]=1; const b=ok?r.shifts:r.waitShifts; b[l.shift]=(b[l.shift]||0)+1; r.any=true; }
      }
    }
    if(r.any) rows.push(r);
  }
  const names=[...new Set(rows.flatMap(r=>Object.keys(r.cells)))];
  const cols=names.map(n=>({name:n,kind:kinds[n]||(jobs.has(n)?'job':'daily')}))
    .sort((a,b)=>KIND_ORDER[a.kind]-KIND_ORDER[b.kind]||a.name.localeCompare(b.name));
  const tot={}, wt={}, shiftTot={};
  for(const r of rows){
    for(const [k,c] of Object.entries(r.cells)){ tot[k]=(tot[k]||0)+c.n; wt[k]=(wt[k]||0)+c.wait; }
    for(const [k,n] of Object.entries(r.shifts)) shiftTot[k]=(shiftTot[k]||0)+n;
  }
  return {rows,cols,tot,wt,shiftTot};
}
function dayList(days){
  const n={}; for(const d of days) n[d]=(n[d]||0)+1;
  return Object.keys(n).sort().map(d=>shortDay(d)+(n[d]>1?' ×'+n[d]:'')).join(' · ');
}
function shiftChips(o,cls){ return Object.entries(o).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([k,n])=>`<span class="sh${cls||''}">${esc(k)}<i>× ${n}</i></span>`).join(''); }
function allowHtml(){
  const {rows,cols,tot,wt,shiftTot}=allowData();
  const out=WEEK.people.filter(p=>p.status!=='approved'&&p.lines.length).length;
  const title=`<div class="printonly"><h2 style="margin:0 0 10px">Allowances — ${esc(WEEK.site)}, ${esc(weekLabel(WEEK.weekStart,WEEK.weekEnd))}${INCL_WAIT?' (including not yet approved)':' (approved)'}</h2></div>`;
  const note=out&&!INCL_WAIT?`<div class="banner warn noprint" style="margin:0 0 14px">${out} ${out===1?'person isn’t':'people aren’t'} fully approved yet, so their unapproved allowances aren’t counted.
      <button class="btn small" onclick="INCL_WAIT=true;renderWeek()">Show them too</button></div>`:'';
  if(!rows.length) return title+note+`<div class="card empty">No allowances or shifts ${INCL_WAIT?'':'approved '}this week.</div>`;
  const tiles=cols.map(c=>`<div class="atile k-${c.kind}"><b>${tot[c.name]||0}</b>${wt[c.name]?`<span class="meta" style="color:var(--amber);font-weight:700">+${wt[c.name]} waiting</span>`:''}<div class="nm">${esc(c.name)}</div><div class="kd">${esc(KIND[c.kind])}</div></div>`).join('');
  const sh=Object.keys(shiftTot).length?`<div class="shiftrow"><b style="margin-right:4px">Shifts worked</b>${shiftChips(shiftTot)}</div>`:'';
  // header: allowance kind groups over their columns
  const groups=[]; for(const c of cols){ const g=groups[groups.length-1]; if(g&&g.kind===c.kind) g.n++; else groups.push({kind:c.kind,n:1}); }
  const head=`<tr><th rowspan="2">Name</th><th rowspan="2">Shifts worked</th>${groups.map(g=>`<th class="grp k-${g.kind}" colspan="${g.n}">${esc(KIND[g.kind])}</th>`).join('')}</tr>
    <tr>${cols.map(c=>`<th class="col">${esc(c.name)}</th>`).join('')}</tr>`;
  const cell=(c,col)=>{
    if(!c||(!c.n&&!c.wait)) return '<td class="c none">–</td>';
    const big=col.kind==='weekly'?(c.n?'✓':''):(c.n||'');
    return `<td class="c">${big!==''?`<b>${big}</b>`:''}${c.wait?`<span class="w">+${c.wait} waiting</span>`:''}${col.kind==='weekly'?'':`<small>${esc(dayList(c.days))}</small>`}</td>`;
  };
  const body=rows.map(r=>`<tr class="${r.state.all?'isdone':''}">
      <td class="nm"><button onclick="openFromAllow(${js(r.p.key)})">${esc(r.p.name)}</button><div class="meta" style="font-size:11.5px">${esc(r.p.type||'')}${r.p.status!=='approved'?' · '+esc(STATUS[r.p.status]):''}${r.state.all?' · ✓ processed':''}</div></td>
      <td>${shiftChips(r.shifts)||(Object.keys(r.waitShifts).length?'':'<span class="meta">–</span>')}${Object.keys(r.waitShifts).length?`<div style="margin-top:3px">${shiftChips(r.waitShifts)} <span class="meta" style="color:var(--amber);font-size:11px;font-weight:700">waiting</span></div>`:''}</td>
      ${cols.map(c=>cell(r.cells[c.name],c)).join('')}</tr>`).join('');
  const foot=`<tr class="tot"><td class="nm">Total <span class="meta">(${rows.length} people)</span></td><td>${shiftChips(shiftTot)}</td>${cols.map(c=>`<td class="c"><b>${tot[c.name]||0}</b>${wt[c.name]?`<span class="w">+${wt[c.name]} waiting</span>`:''}</td>`).join('')}</tr>`;
  return title+note+`<div class="atiles">${tiles}</div>${sh}
    <div class="tablewrap"><table class="atable"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>
    <div class="meta" style="margin-top:8px">Counts are numbers of days (per shift / day), call-outs (per job) or ✓ for the week (weekly). Shifts are counted once a day, from <b>Shift worked</b>. Grey rows are processed. Click a name to see their lines. The Excel download has the same table on its <b>Allowances</b> sheet.</div>`;
}
function openFromAllow(key){
  VIEW='people'; FILTER='all'; QUERY=''; OPEN.add(key); renderWeek();
  const el=document.getElementById('p-'+key); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function setFilter(k){ FILTER=k; renderWeek(); }

function renderPeople(){
  const days=weekDays();
  const list=WEEK.people.filter(matches);
  if(!list.length){ document.getElementById('people').innerHTML='<div class="card empty">Nobody matches.</div>'; return; }
  document.getElementById('people').innerHTML=list.map(p=>{
    const s=personState(p), open=OPEN.has(p.key);
    const counted=p.lines.filter(l=>l.status!=='Rejected');
    const cells=days.map(d=>{
      const h=counted.filter(l=>l.date===d&&!l.allow).reduce((t,l)=>t+l.hr,0);
      const lv=p.leave.some(l=>l.days.some(x=>x.date===d));
      return `<div class="${h?'':lv?'lv':'zero'}"><small>${shortDay(d)}</small>${h?fmtHr(h):lv?'Leave':'–'}</div>`;
    }).join('');
    const act=!s.total?(p.status==='approved'?'':`<span class="meta">Nothing approved yet</span>`)
      :s.all?`<button class="btn small done" onclick="event.stopPropagation();unprocessPerson(${js(p.key)})" title="Click to undo">✓ Processed</button>`
      :`<button class="btn small primary" onclick="event.stopPropagation();processPerson(${js(p.key)})">Process ${s.done?'the rest':'all'}${s.done?` (${s.total-s.done})`:''}</button>`;
    return `<div class="person${open?' open':''}${s.all?' alldone':''}" id="p-${esc(p.key)}">
      <div class="top" onclick="togglePerson(${js(p.key)})">
        <div class="who"><div class="av">${esc(initials(p.name))}</div><div style="min-width:0"><b>${esc(p.name)}</b><span class="meta">${esc(p.type||'')}${s.total?` · ${s.done}/${s.total} processed`:''}</span></div></div>
        <div>${pill(p.status,STATUS[p.status])}</div>
        <div class="days">${cells}</div>
        <div class="tot">${p.lines.length?fmtHr(p.total):'–'}</div>
        <div class="act">${act}</div>
      </div>
      ${open?`<div class="body">${detailHtml(p)}</div>`:''}
    </div>`;
  }).join('');
}

function reasonOf(p){ const r=p.lines.find(l=>l.status==='Rejected'&&l.rejection); return r?'“'+r.rejection+'”':''; }
function chaseLink(emails,p){
  const wk=weekLabel(WEEK.weekStart,WEEK.weekEnd);
  const subj=`Timesheet for ${WEEK.site}, ${wk}`;
  const msg=p&&p.status==='sentback'?`Hi ${p.name.split(' ')[0]},\n\nYour timesheet for ${wk} was sent back${reasonOf(p)?' ('+reasonOf(p)+')':''}. Please fix it and save it again so it can be approved for pay.\n\nThanks`
    :p&&(p.status==='waiting'||p.status==='senior')?`Hi,\n\nThe timesheet for ${p.name}, ${wk}, is still waiting for approval. Please approve it so it can be paid.\n\nThanks`
    :`Hi${p?' '+p.name.split(' ')[0]:''},\n\nWe don't have a timesheet from you for ${wk} yet. Please put it in today so it can be paid.\n\nThanks`;
  const to=p?emails.join(';'):'';
  const bcc=p?'':'&bcc='+encodeURIComponent(emails.join(';'));
  return `mailto:${to}?subject=${encodeURIComponent(subj)}${bcc}&body=${encodeURIComponent(msg)}`;
}

/* ---------- a person's lines ---------- */
function blankEdit(key){ return {key,edits:{},removed:new Set(),added:[],note:''}; }
function dirty(){ return !!EDIT&&(Object.keys(EDIT.edits).length||EDIT.removed.size||EDIT.added.length); }
function leaveEdits(){ return !dirty()||confirm('Discard your unsaved changes?'); }
function togglePerson(key){
  if(OPEN.has(key)){ if(EDIT&&EDIT.key===key){ if(!leaveEdits()) return; EDIT=null; } OPEN.delete(key); }
  else OPEN.add(key);
  renderPeople();
}
function editFor(key){ if(!EDIT||EDIT.key!==key){ if(dirty()) return null; EDIT=blankEdit(key); } return EDIT; }
function canEdit(l){ return l.status==='Approved'&&!l.processed; }
function detailHtml(p){
  const days=weekDays(), E=(EDIT&&EDIT.key===p.key)?EDIT:blankEdit(p.key);
  const statusOf=l=>l.status==='Approved'?(l.processed?pill('done','Processed'):pill('approved','Approved'))
    :l.status==='Rejected'?pill('sentback','Sent back'):pill('waiting',l.held?'Waiting for senior':'Waiting');
  let h=`<div class="tablewrap"><table class="lines"><thead><tr><th style="width:40px" title="Processed">✓</th><th>Day</th><th>Work order / allowance</th><th class="num">Hours</th><th>Comment</th><th>Status</th><th></th></tr></thead><tbody>`;
  if(!p.lines.length) h+=`<tr><td colspan="7" class="meta">No timesheet lines this week.</td></tr>`;
  for(const l of p.lines){
    const e=E.edits[l.id]||{}, gone=E.removed.has(l.id), ed=canEdit(l)&&!gone;
    const jobs=l.jobs&&l.jobs.length?` <span class="tag">${esc(l.jobs.join(', '))}</span>`:'';
    const tick=l.status==='Approved'&&!gone?`<input type="checkbox" class="tick" ${l.processed?'checked':''} onchange="tickLine(${js(p.key)},${js(l.id)},this)" title="${l.processed?'Processed — untick to undo':'Tick when processed'}">`:'';
    h+=`<tr class="${gone?'removed':l.processed?'isdone':''}"><td>${tick}</td><td style="white-space:nowrap">${dayLabel(l.date)}</td>
      <td>${l.allow?esc(l.allow)+' <span class="meta">allowance</span>':ed?`<input class="tx" value="${esc(e.wo!=null?e.wo:l.wo)}" oninput="setEdit(${js(p.key)},${js(l.id)},'wo',this.value)">`:esc(l.wo)||'<span class="meta">–</span>'}${jobs}</td>
      <td class="num">${l.allow?'':ed?`<input class="hr" type="number" step="0.25" min="0" max="24" value="${e.hr!=null?e.hr:l.hr}" oninput="setEdit(${js(p.key)},${js(l.id)},'hr',this.value)">`:fmtHr(l.hr)}</td>
      <td>${ed?`<input class="tx" value="${esc(e.comment!=null?e.comment:l.comment)}" oninput="setEdit(${js(p.key)},${js(l.id)},'comment',this.value)">`:esc(l.comment)}</td>
      <td>${statusOf(l)}${l.processed?`<div class="by">${esc(l.processed.by.split(' ')[0])} · ${esc(whenLabel(l.processed.when))}</div>`:l.approvedBy?`<div class="by">by ${esc(l.approvedBy.replace(/\s*<[^>]*>/,''))}</div>`:''}</td>
      <td class="num">${canEdit(l)?`<button class="btn small" onclick="toggleRemove(${js(p.key)},${js(l.id)})">${gone?'Undo':'Remove'}</button>`:''}</td></tr>`;
  }
  E.added.forEach((a,i)=>{
    h+=`<tr class="adding"><td></td><td>${dayLabel(a.date)}</td><td>${a.kind==='allowance'?esc(a.allow)+' <span class="meta">allowance</span>':esc(a.wo)}</td><td class="num">${a.kind==='allowance'?'':fmtHr(a.hr)}</td><td></td><td>${pill('info','To be added')}</td>
      <td class="num"><button class="btn small" onclick="EDIT.added.splice(${i},1);renderPeople()">Remove</button></td></tr>`;
  });
  h+='</tbody></table></div>';
  for(const l of p.leave) h+=`<div class="meta" style="margin-top:8px">🌴 <b>${esc(l.type)}</b>${l.code?' ('+esc(l.code)+')':''} — ${l.days.map(d=>dayLabel(d.date)+(d.hours?' '+fmtHr(d.hours)+' h':'')).join(', ')} ${L_OK(l)?'':'<span class="tag">'+esc(l.status)+'</span>'}</div>`;
  if(p.lines.some(canEdit)){
    const opts=days.map(d=>`<option value="${d}">${dayLabel(d)}</option>`).join('');
    const isDirty=dirty()&&EDIT.key===p.key;
    h+=`<div class="editbar">
        <b>Add</b>
        <select id="addDay-${esc(p.key)}">${opts}</select>
        <input id="addWo-${esc(p.key)}" placeholder="Work order" style="width:160px">
        <input id="addHr-${esc(p.key)}" type="number" step="0.25" min="0" max="24" placeholder="Hours" style="width:80px">
        <button class="btn small" onclick="addLine(${js(p.key)},'hours')">+ Hours</button>
        <span class="meta">or</span>
        <input id="addAllow-${esc(p.key)}" list="allowList" placeholder="Allowance" style="width:180px">
        <button class="btn small" onclick="addLine(${js(p.key)},'allowance')">+ Allowance</button>
      </div>
      <div class="row" style="margin-top:10px">
        <input placeholder="Reason for the change (saved with it)" class="grow" style="min-width:220px" value="${esc(E.note||'')}" oninput="const x=editFor(${js(p.key)});if(x)x.note=this.value">
        <button class="btn primary" id="save-${esc(p.key)}" onclick="saveEdits(${js(p.key)})"${isDirty?'':' disabled'}>Save changes</button>
        ${isDirty?`<button class="btn" onclick="EDIT=null;renderPeople()">Cancel</button>`:''}
      </div>`;
  }else if(p.lines.length&&personState(p).all) h+='<div class="meta" style="margin-top:10px">All processed. Untick a line (or click ✓ Processed) to change it.</div>';
  else if(p.lines.length) h+='<div class="meta" style="margin-top:10px">Only approved lines can be changed here. Waiting or sent-back lines are for the supervisor and the worker.</div>';
  if(p.log.length) h+=`<div class="log"><b>History</b>${p.log.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
  return h;
}
function setEdit(key,id,k,v){
  const x=editFor(key); if(!x){ toast('Save or cancel the changes for the other person first'); renderPeople(); return; }
  const l=WEEK.people.flatMap(p=>p.lines).find(z=>z.id===id); if(!l) return;
  const e=x.edits[id]=x.edits[id]||{};
  if(String(v)===String(l[k])) delete e[k]; else e[k]=v;
  if(!Object.keys(e).length) delete x.edits[id];
  const b=document.getElementById('save-'+key); if(b) b.disabled=!dirty();
}
function toggleRemove(key,id){ const x=editFor(key); if(!x){ toast('Save or cancel the changes for the other person first'); return; } x.removed.has(id)?x.removed.delete(id):x.removed.add(id); renderPeople(); }
function addLine(key,kind){
  const x=editFor(key); if(!x){ toast('Save or cancel the changes for the other person first'); return; }
  const v=id=>document.getElementById(id+'-'+key);
  const date=v('addDay').value;
  if(kind==='allowance'){
    const allow=v('addAllow').value.trim();
    if(!allow){ toast('Choose the allowance first'); return; }
    x.added.push({person:key,kind,date,allow});
  }else{
    const hr=parseFloat(v('addHr').value);
    if(!(hr>0&&hr<=24)){ toast('Enter hours between 0 and 24'); return; }
    x.added.push({person:key,kind,date,hr,wo:v('addWo').value.trim()});
  }
  renderPeople();
}
async function saveEdits(key){
  if(!dirty()||EDIT.key!==key) return;
  const b=document.getElementById('save-'+key); if(b){ b.disabled=true; b.textContent='Saving…'; }
  try{
    const r=await api({action:'edit',site:WEEK.site,weekStart:WEEK.weekStart,edits:EDIT.edits,removedIds:[...EDIT.removed],added:EDIT.added,note:EDIT.note||''});
    toast(`Saved — ${[r.changed&&r.changed+' changed',r.removed&&r.removed+' removed',r.added&&r.added+' added'].filter(Boolean).join(', ')||'no changes'}`);
    await loadWeek(WEEK.site,WEEK.weekStart,true);
  }catch(e){ toast(e.message); if(b){ b.disabled=false; b.textContent='Save changes'; } }
}

/* ---------- employees: anyone's timesheets, any week ---------- */
let PEOPLE=null, PERSON=null, EMP=null, SUGG=[], SUGGI=-1, EMP_OPEN=new Set();
function goEmp(){ if(!leaveEdits()) return; EDIT=null; history.pushState(null,'',PERSON?empHash():'#emp'); showEmp(new URLSearchParams(location.hash.slice(1))); }
function empHash(){
  if(!PERSON) return '#emp';
  const r=document.getElementById('empRange').value, q=new URLSearchParams({emp:PERSON.name});
  if(PERSON.id) q.set('id',PERSON.id);
  q.set('range',r);
  if(r==='week') q.set('date',document.getElementById('empDate').value);
  if(r==='custom'){ q.set('from',document.getElementById('empFrom').value); q.set('to',document.getElementById('empTo').value); }
  return '#'+q.toString();
}
async function showEmp(q){
  showView('emp'); WEEK=null;
  if(!PEOPLE){
    try{ PEOPLE=(await api({action:'people'})).people; }catch(e){ toast(e.message); PEOPLE=[]; }
    fillSiteFilter();
    let saved=''; try{ saved=localStorage.getItem('payroll.empSite')||''; }catch(_){}
    if(q&&q.get('site')) saved=q.get('site');
    if(saved&&[...document.getElementById('empSite').options].some(o=>o.value===saved)) document.getElementById('empSite').value=saved;
  }
  const name=q&&q.get('emp');
  if(!name){ if(!PERSON) renderRoster(); return; }
  if(q.get('range')) document.getElementById('empRange').value=q.get('range');
  if(q.get('date')) document.getElementById('empDate').value=q.get('date');
  if(q.get('from')) document.getElementById('empFrom').value=q.get('from');
  if(q.get('to')) document.getElementById('empTo').value=q.get('to');
  showRangeInputs();
  PERSON=PEOPLE.find(p=>p.name===name&&(!q.get('id')||p.id===q.get('id')))||{name,id:q.get('id')||'',email:''};
  document.getElementById('empSearch').value=PERSON.name;
  loadEmp(true);
}
function atSite(p,site){ return !site||String(p.site||'').split(/[;,]/).map(x=>x.trim().toLowerCase()).includes(site.toLowerCase()); }
function siteFilter(){ return document.getElementById('empSite').value; }
function fillSiteFilter(){
  const sel=document.getElementById('empSite'), keep=sel.value;
  const names=[...new Set([...(ME.sites||[]).map(x=>x.name),...(PEOPLE||[]).flatMap(p=>String(p.site||'').split(/[;,]/).map(x=>x.trim()))].filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  sel.innerHTML='<option value="">All sites</option>'+names.map(n=>`<option${n===keep?' selected':''}>${esc(n)}</option>`).join('');
}
function siteFilterChanged(){
  const site=siteFilter();
  try{ localStorage.setItem('payroll.empSite',site); }catch(_){}
  if(!PERSON||!atSite(PERSON,site)){ PERSON=null; EMP=null; document.getElementById('empSearch').value=''; renderRoster(); }
  if(PERSON) return;
  document.getElementById('empSearch').focus();
}
// with no one picked yet: everyone at the chosen site, to click on
function renderRoster(){
  const site=siteFilter(), list=(PEOPLE||[]).filter(p=>atSite(p,site));
  const body=document.getElementById('empBody');
  if(!site){ body.innerHTML='<div class="card empty">Search for someone, or pick a site to see everyone there.</div>'; return; }
  if(!list.length){ body.innerHTML=`<div class="card empty">Nobody has ${esc(site)} as their home site.</div>`; return; }
  const act=list.filter(p=>p.active!==false), old=list.filter(p=>p.active===false);
  const card=p=>`<button class="card sitecard" style="text-align:left;display:flex;gap:10px;align-items:center;padding:12px 14px;font:inherit" onclick="pickFromRoster(${js(p.name)},${js(p.id||'')})">
      <span class="av">${esc(initials(p.name))}</span><span style="min-width:0"><b style="display:block">${esc(p.name)}</b><span class="meta">${esc(p.type)}${p.active===false?' · inactive':''}</span></span></button>`;
  body.innerHTML=`<h2 style="margin-top:0">${esc(site)} <span class="meta">(${act.length} people)</span></h2>
    <div class="grid" style="margin-top:0">${act.map(card).join('')}</div>
    ${old.length?`<h2>Inactive <span class="meta">(${old.length})</span></h2><div class="grid" style="margin-top:0">${old.map(card).join('')}</div>`:''}`;
}
function pickFromRoster(name,id){
  PERSON=(PEOPLE||[]).find(p=>p.name===name&&(p.id||'')===id)||{name,id,email:''};
  document.getElementById('empSearch').value=PERSON.name;
  EMP_OPEN=new Set(); loadEmp();
}
function suggest(v){
  const box=document.getElementById('sugg'), t=String(v||'').trim().toLowerCase(), site=siteFilter();
  SUGG=(PEOPLE||[]).filter(p=>atSite(p,site)&&(!t||p.name.toLowerCase().includes(t))).slice(0,60); SUGGI=-1;
  if(!SUGG.length){ box.innerHTML=t||site?`<div class="meta" style="padding:10px 12px">Nobody${t?' by that name':''}${site?' at '+esc(site):''}</div>`:''; box.classList.toggle('hidden',!(t||site)); return; }
  box.innerHTML=SUGG.map((p,i)=>`<button onmousedown="event.preventDefault();pickPerson(${i})"><span class="av" style="width:28px;height:28px;font-size:11px">${esc(initials(p.name))}</span>
    <span><b>${esc(p.name)}</b>${p.active?'':' <span class="tag">inactive</span>'}</span><span class="meta">${esc(p.type)}${p.site?' · '+esc(p.site):''}</span></button>`).join('');
  box.classList.remove('hidden');
}
document.addEventListener('click',e=>{ if(!e.target.closest('.finder')) document.getElementById('sugg').classList.add('hidden'); });
function suggestKey(e){
  const box=document.getElementById('sugg');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); SUGGI=Math.max(0,Math.min(SUGG.length-1,SUGGI+(e.key==='ArrowDown'?1:-1))); [...box.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('hi',i===SUGGI)); }
  else if(e.key==='Enter'){ e.preventDefault(); if(SUGG.length) pickPerson(SUGGI<0?0:SUGGI); }
  else if(e.key==='Escape') box.classList.add('hidden');
}
function pickPerson(i){
  PERSON=SUGG[i]; if(!PERSON) return;
  document.getElementById('empSearch').value=PERSON.name;
  document.getElementById('sugg').classList.add('hidden');
  EMP_OPEN=new Set(); loadEmp();
}
function showRangeInputs(){
  const r=document.getElementById('empRange').value;
  document.getElementById('empDate').classList.toggle('hidden',r!=='week');
  document.getElementById('empFrom').classList.toggle('hidden',r!=='custom');
  document.getElementById('empTo').classList.toggle('hidden',r!=='custom');
}
function rangeChanged(){
  showRangeInputs();
  const r=document.getElementById('empRange').value, today=new Date().toISOString().slice(0,10);
  if(r==='week'&&!document.getElementById('empDate').value) document.getElementById('empDate').value=today;
  if(r==='custom'){ if(!document.getElementById('empTo').value) document.getElementById('empTo').value=today; if(!document.getElementById('empFrom').value) document.getElementById('empFrom').value=addDays(today,-27); }
  loadEmp();
}
function empRange(){
  const r=document.getElementById('empRange').value, today=new Date().toISOString().slice(0,10);
  if(r==='week'){ const d=document.getElementById('empDate').value||today; return {from:d,to:d}; }
  if(r==='custom') return {from:document.getElementById('empFrom').value||addDays(today,-27),to:document.getElementById('empTo').value||today};
  return {from:addDays(today,-7*(+r)+1),to:today};
}
async function loadEmp(fromHash){
  if(!PERSON) return;
  if(!fromHash){ const h=empHash(); if(location.hash!==h) history.pushState(null,'',h); }
  const body=document.getElementById('empBody');
  body.innerHTML='<div class="meta">Loading '+esc(PERSON.name)+'…</div>';
  const {from,to}=empRange();
  try{
    EMP=await api({action:'person',person:{name:PERSON.name,id:PERSON.id||'',email:PERSON.email||''},from,to});
    if(document.getElementById('empRange').value==='week'&&EMP.weeks.length) EMP.weeks.forEach(w=>EMP_OPEN.add(w.weekStart));
    renderEmp();
  }catch(e){ body.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
function renderEmp(){
  const E=EMP, p=E.person;
  const appr=E.weeks.reduce((t,w)=>t+w.lines.filter(l=>l.status==='Approved').reduce((a,l)=>a+l.hr,0),0);
  const lvH=E.leave.filter(L_OK).reduce((t,l)=>t+l.days.filter(d=>d.date>=E.from&&d.date<=E.to).reduce((a,d)=>a+d.hours,0),0);
  let h=`<div class="card"><div class="profile"><div class="av">${esc(initials(p.name))}</div>
    <div class="grow"><h1>${esc(p.name)}</h1><div class="kv">
      <div><span>Type</span><b>${esc(p.type||'–')}</b></div>
      <div><span>Home site</span><b>${esc(p.site||'–')}</b></div>
      <div><span>Email</span><b>${esc(p.email||'–')}</b></div>
      ${p.contractHours?`<div><span>Contract</span><b>${fmtHr(p.contractHours)} h / week</b></div>`:''}
      ${p.active===false?`<div><span>Status</span><b style="color:var(--red)">Inactive</b></div>`:''}
    </div></div>
    <div class="row noprint"><button class="btn" onclick="expandAll()">${E.weeks.length&&E.weeks.every(w=>EMP_OPEN.has(w.weekStart))?'Collapse all':'Expand all'}</button><button class="btn" onclick="printEmp()">⎙ Print</button></div>
  </div></div>
  <div class="tiles">
    <div class="tile"><div class="l">Period</div><div class="v" style="font-size:16px;margin-top:7px">${dayLabel(E.from)} – ${dayLabel(E.to)}</div></div>
    <div class="tile"><div class="l">Pay weeks with timesheets</div><div class="v">${E.weeks.length}</div></div>
    <div class="tile"><div class="l">Hours (excl. sent back)</div><div class="v">${fmtHr(E.totals.hours)}</div></div>
    <div class="tile"><div class="l">Approved hours</div><div class="v">${fmtHr(appr)}</div></div>
    <div class="tile"><div class="l">Leave hours</div><div class="v">${fmtHr(lvH)}</div></div>
  </div>`;
  if(E.leave.length) h+=`<h2>Leave</h2><div class="tablewrap"><table><thead><tr><th>Type</th><th>Dates</th><th class="num">Days</th><th class="num">Hours</th><th>Status</th><th>Note</th></tr></thead><tbody>
    ${E.leave.map(l=>`<tr><td><b>${esc(l.type)}</b>${l.code?` <span class="meta">${esc(l.code)}</span>`:''}</td><td>${dayLabel(l.start)}${l.end!==l.start?' – '+dayLabel(l.end):''}</td><td class="num">${l.days.length}</td><td class="num">${fmtHr(l.days.reduce((a,d)=>a+d.hours,0))}</td>
      <td>${pill(L_OK(l)?'approved':/declin/i.test(l.status)?'sentback':'waiting',l.status)}</td><td class="meta">${esc(l.note||'')}</td></tr>`).join('')}
    </tbody></table></div>`;
  h+=`<h2>Timesheets</h2>`;
  if(!E.weeks.length) h+=`<div class="card empty">No timesheet lines for ${esc(p.name)} in this period.</div>`;
  for(const w of E.weeks){
    const open=EMP_OPEN.has(w.weekStart), pr=w.processed;
    const procPill=!pr.total?'':pr.done===pr.total?pill('done','✓ Processed'):pr.done?pill('info',`${pr.done}/${pr.total} processed`):pill('done','Not processed');
    h+=`<div class="wk${open?' open':''}">
      <div class="top" onclick="toggleWk('${w.weekStart}')">
        <span class="rng">${weekLabel(w.weekStart,w.weekEnd)}</span>
        <span class="meta">${esc(w.sites.join(', '))}</span>
        ${pill(w.status,STATUS[w.status])}${procPill}
        ${w.leave.length?pill('info','Leave'):''}
        <span class="grow"></span>
        <span class="tot">${fmtHr(w.total)} h</span>
        <span class="meta noprint">${open?'▲':'▼'}</span>
      </div>
      ${open?`<div class="body">${empWeekHtml(w)}</div>`:''}
    </div>`;
  }
  document.getElementById('empBody').innerHTML=h;
}
function toggleWk(ws){ EMP_OPEN.has(ws)?EMP_OPEN.delete(ws):EMP_OPEN.add(ws); renderEmp(); }
function expandAll(){ const all=EMP.weeks.every(w=>EMP_OPEN.has(w.weekStart)); EMP_OPEN=new Set(all?[]:EMP.weeks.map(w=>w.weekStart)); renderEmp(); }
function printEmp(){ EMP_OPEN=new Set(EMP.weeks.map(w=>w.weekStart)); renderEmp(); setTimeout(()=>window.print(),50); }
function dt(s){ if(!s) return ''; const d=new Date(s); return isNaN(d)?s:d.toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}); }
function empWeekHtml(w){
  const byDay={};
  for(const l of w.lines) (byDay[l.date]=byDay[l.date]||[]).push(l);
  let h=`<div class="tablewrap"><table class="full"><thead><tr><th>Day</th><th>Site</th><th>Work order / allowance</th><th class="num">Hours</th><th>Shift</th><th>Comment</th><th>Status</th></tr></thead><tbody>`;
  for(const d of Object.keys(byDay).sort()){
    const ls=byDay[d], dayTot=ls.filter(l=>l.status!=='Rejected').reduce((a,l)=>a+l.hr,0);
    ls.forEach((l,i)=>{
      const st=l.status==='Approved'?pill(l.processed?'done':'approved',l.processed?'Processed':'Approved')
        :l.status==='Rejected'?pill('sentback','Sent back'):pill('waiting',l.held?'Waiting for senior':'Waiting');
      const sub=[l.status==='Approved'&&l.approvedBy?`Approved by ${esc(l.approvedBy)}${l.approvedDate?' · '+esc(dt(l.approvedDate)):''}`:'',
        l.processed?`Processed by ${esc(l.processed.by)} · ${esc(whenLabel(l.processed.when))}`:'',
        l.rejection?`Reason: “${esc(l.rejection)}”`:''].filter(Boolean).map(x=>`<div class="sub">${x}</div>`).join('');
      const shift=l.shiftWorked||l.rostered?`${esc(l.shiftWorked||'–')}${l.rostered&&l.rostered!==l.shiftWorked?`<div class="sub">rostered ${esc(l.rostered)}</div>`:''}`:'<span class="meta">–</span>';
      h+=`<tr${l.processed?' class="isdone"':''}><td style="white-space:nowrap">${i===0?`<b>${dayLabel(d)}</b>${ls.length>1?`<div class="sub">${fmtHr(dayTot)} h day</div>`:''}`:''}</td>
        <td>${esc(l.site)}</td>
        <td>${l.allow?esc(l.allow)+' <span class="meta">allowance</span>':esc(l.wo)||'<span class="meta">–</span>'}${l.jobs.length?` <span class="tag">${esc(l.jobs.join(', '))}</span>`:''}</td>
        <td class="num">${l.allow?'':fmtHr(l.hr)}</td>
        <td>${shift}</td>
        <td>${esc(l.comment)}</td>
        <td>${st}${sub}</td></tr>`;
    });
  }
  h+=`<tr><td colspan="3"><b>Week total</b></td><td class="num"><b>${fmtHr(w.total)}</b></td><td colspan="3"></td></tr></tbody></table></div>`;
  for(const l of w.leave) h+=`<div class="meta" style="margin-top:8px">🌴 <b>${esc(l.type)}</b>${l.code?' ('+esc(l.code)+')':''} — ${l.days.map(d=>dayLabel(d.date)+(d.hours?' '+fmtHr(d.hours)+' h':'')).join(', ')} · ${esc(l.status)}</div>`;
  const hist=w.lines.flatMap(l=>l.notes.map(n=>({d:l.date,n}))).filter((x,i,a)=>a.findIndex(y=>y.n===x.n)===i);
  const saved=w.lines.map(l=>l.created).filter(Boolean).sort(), changed=w.lines.map(l=>l.modified).filter(Boolean).sort();
  h+=`<div class="row" style="margin-top:10px;gap:16px">
    ${saved.length?`<span class="meta">First saved ${esc(dt(saved[0]))}</span>`:''}
    ${changed.length?`<span class="meta">Last changed ${esc(dt(changed[changed.length-1]))}</span>`:''}
    ${w.sites.map(s=>ME.sites.some(x=>x.name===s)?`<button class="btn small noprint" onclick="openWeek(${js(s)},'${w.weekStart}')">Open ${esc(s)} pay week →</button>`:'').join('')}
  </div>`;
  if(hist.length) h+=`<details style="margin-top:8px"${document.getElementById('empRange').value==='week'?' open':''}><summary class="meta" style="cursor:pointer">History (${hist.length})</summary><ul class="hist">${hist.map(x=>`<li>${esc(x.n)}</li>`).join('')}</ul></details>`;
  return h;
}

/* ---------- processed: one line, one person, or the whole week ---------- */
function applyProcessed(ids,on,by,when){
  const set=new Set(ids);
  for(const p of WEEK.people) for(const l of p.lines) if(set.has(l.id)) l.processed=on?{by,when}:null;
}
async function setProcessed(body,on){
  if(BUSY) return false;
  if(dirty()){ toast('Save or cancel your changes first'); return false; }
  BUSY=true;
  try{
    const r=await api({...body,action:on?'process':'reopen',site:WEEK.site,weekStart:WEEK.weekStart});
    applyProcessed(r.ids||[],on,r.by,r.when);
    renderWeek();
    return r;
  }catch(e){ toast(e.message); return false; }
  finally{ BUSY=false; }
}
async function tickLine(key,id,box){
  box.disabled=true;
  const r=await setProcessed({ids:[id]},box.checked);
  if(!r){ box.checked=!box.checked; box.disabled=false; }
}
async function processPerson(key){
  const p=WEEK.people.find(x=>x.key===key);
  const r=await setProcessed({person:key},true);
  if(r) toast(`${p?p.name.split(' ')[0]+':':''} ${r.updated} line${r.updated===1?'':'s'} processed`);
}
async function unprocessPerson(key){
  const p=WEEK.people.find(x=>x.key===key);
  if(!confirm(`Undo processed for ${p?p.name:'this person'}? Their approved lines can then be changed again.`)) return;
  const r=await setProcessed({person:key},false);
  if(r) toast(`${r.updated} line${r.updated===1?'':'s'} reopened`);
}
async function processWeek(){
  if(!WEEK) return;
  const ws=weekState(), reopen=ws.total&&ws.done===ws.total;
  const out=WEEK.people.filter(p=>p.status!=='approved').length;
  const msg=reopen?'Reopen the whole week? Every approved line can be changed again, and will need processing again.'
    :(out?`${out} ${out===1?'person is':'people are'} still outstanding. Process everything that's approved anyway?`:`Process all ${ws.total-ws.done} remaining approved lines?`);
  if(!confirm(msg)) return;
  const b=document.getElementById('procBtn'); b.disabled=true; b.textContent='Working…';
  const r=await setProcessed({},!reopen);
  if(r) toast(reopen?`Reopened ${r.updated} lines`:`Processed ${r.updated} lines`);
  else renderWeek();
}
async function download(format){
  if(!WEEK) return;
  toast('Preparing the '+(format==='pdf'?'PDF':'spreadsheet')+'…');
  try{
    const r=await api({action:'export',site:WEEK.site,weekStart:WEEK.weekStart,format});
    const bin=atob(r.data), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([bytes],{type:r.mime}));
    const a=document.createElement('a'); a.href=url; a.download=r.file; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }catch(e){ toast(e.message); }
}
window.addEventListener('beforeunload',e=>{ if(dirty()){ e.preventDefault(); e.returnValue=''; } });
</script>
