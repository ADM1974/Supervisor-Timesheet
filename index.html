<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#a4161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Approvals">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Timesheet Approvals</title>
<style>
  :root{
    --brand:#a4161a;--brand-dark:#7a1015;--bg:#f5efef;--card:#ffffff;--ink:#1f2329;--muted:#6a7280;--line:#e8e0e0;
    --amber:#b86e00;--green:#0f7b3f;--red:#b3261e;
  }
  *{box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  /* The page itself scrolls (an inner scroll box sized to 100% height hid its bottom behind
     the iPhone Safari toolbar). The app bar stays pinned at the top. */
  html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;position:relative;}
  .appbar{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 16px 14px;display:flex;align-items:center;gap:10px;flex:0 0 auto;position:sticky;top:0;z-index:20;}
  .appbar .ttl{font-size:16px;font-weight:600;flex:1;}
  .appbar .user{font-size:11px;background:rgba(255,255,255,.22);padding:4px 9px;border-radius:20px;cursor:pointer;}
  .body{flex:1 0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 100px);max-width:560px;width:100%;margin:0 auto;}
  .body::-webkit-scrollbar{width:0;}
  .sh{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin:2px 2px 4px;}
  .meta{color:var(--muted);font-size:12px;line-height:1.5;}
  .weekhead{margin:2px 2px 12px;}
  .weekhead .rng{font-size:15px;font-weight:600;color:var(--ink);}
  /* ---- approval card ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:13px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .card .who{font-weight:700;font-size:16px;}
  .card .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .card .gtot{font-weight:700;font-size:15px;color:var(--brand-dark);white-space:nowrap;}
  .dayrow{border-top:1px solid var(--line);padding:8px 0 4px;}
  .dayrow .dn{font-size:12.5px;font-weight:600;color:#3b424b;margin-bottom:4px;}
  .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:2px 0;}
  .ln .wo{color:var(--ink);}
  .ln .hr{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .ln .tag{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--brand-dark);background:#f3e7e7;border-radius:10px;padding:2px 8px;white-space:nowrap;align-self:center;}
  .lncomment{font-size:11.5px;color:var(--muted);font-style:italic;padding:0 0 5px 2px;}
  .daysub{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:#3b424b;border-top:1px dashed var(--line);margin-top:4px;padding-top:4px;}
  .daysub .hr{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .cotag{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8a4b00;background:#fdf0dc;border-radius:10px;padding:1px 7px;margin-left:6px;white-space:nowrap;}
  .dn .shf{font-weight:500;color:var(--muted);}
  .ocnote{background:#fdf0dc;border:1px solid #f0cf98;color:#8a4b00;border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600;margin:6px 0 8px;}
  .ocnote.held{background:#eef3fb;border-color:#c9d8ef;color:#2b4a7a;}
  .waitnote{flex:2;align-self:center;font-size:12.5px;color:var(--muted);}
  .shdiff{font-size:11.5px;color:#8a4b00;padding:0 0 4px;}
  .payrollbtn{margin-top:12px;width:100%;padding:11px;border:1.5px solid var(--brand);background:#fff;color:var(--brand-dark);border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .payrollbtn:active{background:#f5efef;}
  .payrollbtn:disabled{opacity:.55;cursor:default;}
  .worow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:7px 0;font-size:13.5px;}
  .wodel{border:none;background:none;color:var(--red);font-size:15px;cursor:pointer;padding:0 4px;line-height:1;}
  .woadd-lbl{font-size:11.5px;color:var(--muted);margin-top:10px;font-weight:600;}
  .woadd-lbl span{font-weight:400;}
  .wota{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:7px;padding:8px 9px;font-size:13px;font-family:inherit;resize:vertical;margin-top:5px;}
  .acts{display:flex;gap:10px;margin-top:12px;}
  .acts button{flex:1;padding:12px;border-radius:9px;font-size:14.5px;font-weight:600;cursor:pointer;border:1.5px solid transparent;}
  .acts .approve{background:var(--green);color:#fff;}
  .acts .reject{background:#fff;color:var(--red);border-color:var(--red);}
  .acts button:disabled{opacity:.55;cursor:default;}
  .acts .amendbtn{background:#fff;color:var(--brand-dark);border-color:var(--brand-dark);}
  .card.amending{border:2px solid var(--brand);}
  .amendrow{border-top:1px solid var(--line);padding:6px 0;}
  .amendrow .ln{align-items:center;gap:8px;}
  .amendrow.removed{opacity:.5;}
  .amendrow.removed input{text-decoration:line-through;}
  .ln .amwo{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13px;font-family:inherit;}
  .ln .amhr{width:64px;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13px;text-align:right;font-family:inherit;}
  .amdel{border:none;background:none;color:var(--red);font-size:16px;cursor:pointer;padding:0 3px;line-height:1;}
  .amcomment{width:100%;box-sizing:border-box;margin-top:5px;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:12.5px;font-family:inherit;}
.amnote{margin:10px 0 2px;}
.amnote label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.amnote textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px;font-family:inherit;resize:vertical;}
.caddrow{display:flex;gap:8px;align-items:center;margin-top:8px;}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:9px 0;flex-wrap:wrap;}
.crow.off{opacity:.55;}
.cmain{min-width:0;}
.cname{font-weight:600;font-size:14px;}
.cinactive{font-weight:600;font-size:11px;color:var(--muted);}
.ccode{margin-top:2px;}
.ccode .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;letter-spacing:1.5px;font-weight:700;color:var(--brand-dark);background:#f5efef;border-radius:6px;padding:2px 8px;cursor:pointer;}
.cbtns{display:flex;gap:6px;flex-wrap:wrap;}
.cbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:6px 10px;font-size:12.5px;font-family:inherit;cursor:pointer;}
.cbtn.add{border-color:var(--brand);color:var(--brand-dark);font-weight:600;white-space:nowrap;}
.cbtn:active{background:#f5efef;}
.cbtn:disabled{opacity:.55;cursor:default;}
  .empty{text-align:center;color:var(--muted);font-size:15px;padding:46px 16px;}
  .siteroll{margin-bottom:10px;}
  .siteroll>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;color:var(--ink);}
  .siteroll>summary::-webkit-details-marker{display:none;}
  .siteroll>summary .sc{font-weight:500;font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .siteroll>summary .sn::before{content:'▸';display:inline-block;width:16px;color:var(--muted);transition:transform .15s;}
  .siteroll[open]>summary .sn::before{transform:rotate(90deg);}
  .siteroll[open]>summary{margin-bottom:10px;border-color:var(--brand);}
  .siteroll.none>summary{cursor:default;opacity:.7;}
  .siteroll.none>summary .sn::before{content:'✓';}
  .empty .big{font-size:40px;margin-bottom:8px;}
  .loading{text-align:center;color:var(--muted);font-size:14px;padding:30px 0;}
  .signin{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 18px 22px;box-shadow:0 1px 2px rgba(16,24,40,.04);text-align:center;margin-top:30px;}
  .signin .logo{width:64px;height:64px;border-radius:16px;margin:2px auto 14px;display:block;}
  .signin h2{font-size:18px;font-weight:600;margin:0 0 6px;}
  .signin .ms{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;margin-top:18px;background:#fff;border:1px solid #cdd3da;border-radius:8px;font-size:15px;font-weight:600;color:#1f2329;cursor:pointer;}
  .signin .ms:hover{background:#f4f7fb;}
  .signin .ms .g{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;width:18px;height:18px;}
  .signin .ms .g i{display:block;width:8px;height:8px;}
  .signin .err{color:var(--red);font-size:13px;min-height:18px;margin-top:12px;}
  .signin .foot{font-size:11px;color:var(--muted);margin-top:14px;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 28px);background:#1f2329;color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:320px;z-index:30;}
  .toast.show{opacity:.96;}
  .verbadge{position:fixed;left:calc(env(safe-area-inset-left) + 14px);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:40;background:rgba(31,35,41,.62);color:#fff;font-size:10px;line-height:1;padding:4px 7px;border-radius:10px;letter-spacing:.3px;pointer-events:none;}
  .expirybar{background:#9a6400;color:#fff;font-size:12.5px;line-height:1.45;padding:10px 14px;text-align:center;}
  .expirybar.urgent{background:#b3261e;}
  .expirybar a{color:#fff;text-decoration:underline;font-weight:600;white-space:nowrap;}
  .hidden{display:none !important;}
</style>
</head>
<body>
  <div id="expiryBar" class="expirybar hidden"></div>
  <div class="appbar">
    <span class="ttl">Approvals</span>
    <span class="user hidden" id="who" onclick="signOut()">Sign out</span>
  </div>
  <div id="cdbar" style="display:none;background:#2b2f36;color:#fff;text-align:center;font-size:12.5px;padding:6px 10px;letter-spacing:.3px">⏱ Next payroll send in <b id="cdval" style="font-variant-numeric:tabular-nums">—</b></div>

  <!-- ===== SIGN IN ===== -->
  <div class="body" id="gateBody">
    <div class="signin">
      <img class="logo" src="icons/icon-192.png" alt="">
      <h2>Timesheet approvals</h2>
      <div class="meta">Sign in with your work account to review and approve the timesheets for the sites you supervise.</div>
      <button class="ms" id="msBtn" onclick="signIn()">
        <span class="g"><i style="background:#f25022"></i><i style="background:#7fba00"></i><i style="background:#00a4ef"></i><i style="background:#ffb900"></i></span>
        Sign in with Microsoft
      </button>
      <div class="err" id="signErr"></div>
      <div class="foot" id="signinVer" style="opacity:.55;margin-top:14px"></div>
    </div>
  </div>

  <!-- ===== APPROVALS ===== -->
  <div class="body hidden" id="appView">
    <div class="weekhead" id="head"></div>
    <div id="cards"><div class="loading">Loading approvals…</div></div>
    <div class="foot" style="text-align:center;margin-top:16px"><a href="guide.html" style="color:var(--brand-dark);font-weight:600;text-decoration:none;font-size:12.5px">How the timesheet system works →</a></div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="verbadge" id="verbadge"></div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
<script src="config.js"></script>
<script>
let msalInstance=null, account=null, userName='there', userEmail='', GROUPS=[], SITES=[];
const SCOPES=['openid','profile','email'];

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function firstName(n){return (n||'').trim().split(/\s+/)[0]||'there';}
function dayLabel(date){return new Date(date+'T00:00:00Z').toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});}
function weekRange(weekStart){
  if(!weekStart) return '';
  const start=new Date(weekStart+'T00:00:00Z');
  const end=new Date(start.getTime()+6*86400000);
  const iso=d=>d.toISOString().slice(0,10);
  return dayLabel(iso(start))+' – '+dayLabel(iso(end));
}
function fmtHr(n){const v=Math.round((Number(n)||0)*100)/100;return (Number.isInteger(v)?v.toFixed(1):String(v))+' h';}

/* ---------- Microsoft sign-in ---------- */
(async function init(){
  const cfg=window.SUP_CONFIG||{};
  if(!cfg.clientId || cfg.clientId.indexOf('PASTE')===0){ document.getElementById('signErr').textContent='Sign-in not configured yet (clientId missing in config.js).'; return; }
  try{
    msalInstance=new msal.PublicClientApplication({
      auth:{ clientId:cfg.clientId, authority:'https://login.microsoftonline.com/'+cfg.tenantId, redirectUri:window.location.origin },
      cache:{ cacheLocation:'localStorage' }
    });
    await msalInstance.initialize();
    const resp=await msalInstance.handleRedirectPromise();
    account=(resp && resp.account) || msalInstance.getAllAccounts()[0] || null;
    if(account){ msalInstance.setActiveAccount(account); if(resp){ try{ sessionStorage.removeItem('reauthAt'); }catch(_){} } afterSignIn(); }
  }catch(e){ document.getElementById('signErr').textContent='Sign-in error — try again.'; }
})();

async function signIn(){
  if(!msalInstance){ return; }
  try{ await msalInstance.loginRedirect({ scopes:SCOPES }); }
  catch(e){ document.getElementById('signErr').textContent='Couldn’t start sign-in.'; }
}
function signOut(){ if(msalInstance && account){ msalInstance.logoutRedirect({ account }); } }

/* Staying signed in. The server checks our Microsoft ID token, which lasts ~1 hour. MSAL
   hands back its cached copy without checking it, so refresh it ourselves before it runs out.
   If Microsoft needs the person to sign in again (refresh token expired, ~24h), send them
   straight back through sign-in (account pre-filled) instead of showing a "signal" error. */
function isNetworkErr(e){ return !navigator.onLine || /request_failed|network|endpoints_resolution|timed_out|timeout/i.test(String((e&&(e.errorCode||e.message))||'')); }
function reauth(){
  let last=0; try{ last=+sessionStorage.getItem('reauthAt')||0; }catch(_){}
  if(Date.now()-last<60000){ toast('Please sign out and sign in again'); return; }   // don't loop
  try{ sessionStorage.setItem('reauthAt',String(Date.now())); }catch(_){}
  toast('Signing you in again…');
  msalInstance.loginRedirect({ scopes:SCOPES, loginHint:(account&&account.username)||undefined }).catch(()=>{});
}
class ReauthNeeded extends Error { constructor(){ super('Signing you in again…'); } }
async function getToken(force){
  try{
    let res=await msalInstance.acquireTokenSilent({ account, scopes:SCOPES, forceRefresh:!!force });
    const exp=((res.idTokenClaims||{}).exp||0)*1000;
    if(!force && exp && exp-Date.now()<5*60000) res=await msalInstance.acquireTokenSilent({ account, scopes:SCOPES, forceRefresh:true });
    return res.idToken;
  }catch(e){
    if(isNetworkErr(e)) throw e;          // genuinely offline → caller shows "check signal"
    reauth(); throw new ReauthNeeded();
  }
}
async function api(path, body){
  const send=token=>fetch(path,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body: body?JSON.stringify(body):'{}' });
  let res=await send(await getToken(false));
  if(res.status===401){                    // token rejected → one retry with a brand-new token
    res=await send(await getToken(true));
    if(res.status===401){ reauth(); throw new ReauthNeeded(); }
  }
  return res;
}

function afterSignIn(){
  userName=(account && (account.name || (account.idTokenClaims && account.idTokenClaims.name))) || 'there';
  userEmail=(account && (account.username || (account.idTokenClaims && account.idTokenClaims.preferred_username))) || '';
  document.getElementById('gateBody').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  const chip=document.getElementById('who'); chip.classList.remove('hidden'); chip.textContent=firstName(userName)+' · Sign out';
  loadPending();
}

/* ---------- approvals ---------- */
async function loadPending(){
  document.getElementById('cards').innerHTML='<div class="loading">Loading approvals…</div>';
  try{
    const res=await api('/.netlify/functions/pending',{});
    if(res.status===401){ toast('Please sign in again'); return; }
    const data=await res.json();
    if(!data.ok) throw new Error('load');
    SITES=data.sites||[];
    GROUPS=data.groups||[];
    renderApprovals();
    setCountdown(data.nextSend);
  }catch(e){ document.getElementById('cards').innerHTML='<div class="loading">Couldn’t load approvals — check signal.</div>'; }
}

function renderApprovals(){
  document.getElementById('head').innerHTML=
    `<div class="sh">Hi ${esc(firstName(userName))} — timesheets to approve</div>`+
    (userEmail?`<div class="meta">Signed in as ${esc(userEmail)}</div>`:'')+
    (SITES.length?`<div class="meta">Your sites: ${esc(SITES.join(' · '))} &nbsp;·&nbsp; <a href="#" onclick="event.preventDefault();loadPending()" style="color:var(--brand-dark);font-weight:700;text-decoration:none">↻ Refresh</a></div>`:'')+
    (SITES.length?`<button class="payrollbtn" onclick="sendPayroll('last')">📧 Email last week’s payroll report</button><div style="text-align:center;margin-top:7px"><a href="#" onclick="event.preventDefault();sendPayroll('current')" style="font-size:12px;color:var(--brand-dark)">…or send this week so far (for testing)</a></div><div style="text-align:center;margin-top:10px"><a href="#" onclick="event.preventDefault();loadWorkOrders()" style="font-size:12.5px;color:var(--brand-dark);font-weight:600">🛠 Manage work orders</a></div><div style="text-align:center;margin-top:8px"><a href="#" onclick="event.preventDefault();loadContractors()" style="font-size:12.5px;color:var(--brand-dark);font-weight:600">👷 Manage contractors &amp; codes</a></div>`:'');

  const wrap=document.getElementById('cards');

  if(!SITES.length){
    wrap.innerHTML=`<div class="empty"><div class="big">🏗️</div>No sites are linked to <b>${esc(userEmail||'your account')}</b> yet.<br><br>On the Sites list, set <b>ManagerName</b> so it forms this email (first-initial.surname@ael.co), or add a <b>ManagerEmail</b> column with this exact address.</div>`;
    return;
  }
  if(!GROUPS.length){
    wrap.innerHTML=`<div class="empty"><div class="big">✅</div>All caught up — no timesheets waiting.</div>`;
    return;
  }
  // One site: plain list. Several: a roll-up per site (tap to open), showing how many
  // timesheets are waiting and their hours. Open/closed is remembered on this device.
  const bySite={};
  for(const g of GROUPS){ const k=g.site||'No site'; (bySite[k]=bySite[k]||[]).push(g); }
  const keys=[...new Set([...SITES,...Object.keys(bySite)])].sort((a,b)=>a.localeCompare(b));
  if(keys.length<2){ wrap.innerHTML=GROUPS.map(cardHtml).join(''); return; }
  wrap.innerHTML=keys.map(k=>{
    const gs=bySite[k]||[];
    if(!gs.length) return `<details class="siteroll none" onclick="event.preventDefault()"><summary><span class="sn">${esc(k)}</span><span class="sc">nothing waiting</span></summary></details>`;
    const hrs=gs.reduce((s,g)=>s+(Number(g.total)||0),0);
    const open=OPEN_SITES.has(k) || gs.some(g=>g.key===AMEND_KEY);
    return `<details class="siteroll" data-site="${esc(k)}" ${open?'open':''} ontoggle="siteToggle(this)"><summary><span class="sn">${esc(k)}</span><span class="sc">${gs.length} waiting · ${fmtHr(hrs)}</span></summary>${gs.map(cardHtml).join('')}</details>`;
  }).join('');
}
let OPEN_SITES=new Set((()=>{ try{ return JSON.parse(localStorage.getItem('openSites')||'[]'); }catch(_){ return []; } })());
function siteToggle(el){
  const k=el.dataset.site; if(!k) return;
  if(el.open) OPEN_SITES.add(k); else OPEN_SITES.delete(k);
  try{ localStorage.setItem('openSites',JSON.stringify([...OPEN_SITES])); }catch(_){}
}

let AMEND_KEY=null;

function cardHtml(g){
  if(g.key===AMEND_KEY) return amendCardHtml(g);
  const days=(g.days||[]).map(d=>{
    const lines=(d.lines||[]).slice().sort((a,b)=>(a.allow?1:0)-(b.allow?1:0)).map(l=> l.allow
      ? `<div class="ln"><span class="wo">${esc(l.allow)}</span><span class="tag">allowance</span></div>`
      : `<div class="ln"><span class="wo">${esc(l.wo||'—')}${jobTags(l)}</span><span class="hr">${fmtHr(l.hr)}</span></div>${l.comment?`<div class="lncomment">${esc(l.comment)}</div>`:''}`).join('');
    const sub=(d.lines||[]).filter(l=>!l.allow).reduce((s,l)=>s+(Number(l.hr)||0),0);   // the day's hours (allowances carry none)
    return `<div class="dayrow">${dayHead(d)}${lines}<div class="daysub"><span>Day total</span><span class="hr">${fmtHr(sub)}</span></div></div>`;
  }).join('');
  return `<div class="card" id="card-${esc(g.key)}">
    <div class="hd">
      <div>
        <div class="who">${esc(g.name)}</div>
        <div class="sub">${esc(g.site||'')}${g.weekStart?' · '+esc(weekRange(g.weekStart)):''}</div>
      </div>
      <div class="gtot">${fmtHr(g.total)}</div>
    </div>
    ${contractNote(g)}
    ${days}
    <div class="acts">
      ${g.held && !g.canSenior
        ? `<span class="waitnote">Waiting for the senior approver</span>`
        : `<button class="approve" onclick="decide('${esc(g.key)}','approve')">${g.held?'Approve extra hours':'Approve'}</button>
      <button class="amendbtn" onclick="startAmend('${esc(g.key)}')">Amend</button>`}
      <button class="reject" onclick="decide('${esc(g.key)}','reject')">Reject</button>
    </div>
  </div>`;
}
// Per-job allowances on a work-order line (e.g. Call-out, Call-out – on site).
function jobTags(l){ return (l.jobs||[]).map(j=>`<span class="cotag">${esc(j)}</span>`).join(''); }
// Week over the worker's contract hours (Workers.ContractHours): needs the senior approver as well.
function contractNote(g){
  if(!(g.overBy>0)) return '';
  const base=`${fmtHr(g.overBy)} over the ${fmtHr(g.contract)} contract`;
  if(g.held) return `<div class="ocnote held">⏳ ${base} — OK’d by ${esc(g.heldBy||'the supervisor')}; ${g.canSenior?'needs your senior approval.':'waiting for the senior approver.'}</div>`;
  return `<div class="ocnote">⚠ ${base} — ${g.canSenior?'you’re the senior approver, so approving also signs off the extra hours.':'once you approve, the site’s senior approver has to OK the extra hours.'}</div>`;
}

// Day heading + the shift they say they worked (staff app). If it differs from the
// Teams roster for that day (fixed at the start of the week), say what was rostered.
function dayHead(d){
  const w=String(d.shiftWorked||'').trim(), r=String(d.rosteredShift||'').trim();
  const differs=r ? !(w && (r.toLowerCase()===w.toLowerCase() || r.toLowerCase().startsWith(w.toLowerCase()+' '))) : false;
  return `<div class="dn">${dayLabel(d.date)}${w?` <span class="shf">· ${esc(w)} shift</span>`:''}</div>`
    +(differs?`<div class="shdiff">⚠ Rostered: ${esc(r)}${w?'':' — no shift entered'}</div>`:'');
}

// Edit mode: fix the hours / work order / comment, or ✕ a line, then save & approve.
function amendCardHtml(g){
  const days=(g.days||[]).map(d=>{
    const lines=(d.lines||[]).slice().sort((a,b)=>(a.allow?1:0)-(b.allow?1:0)).map(l=>{
      if(l.allow){
        return `<div class="amendrow" data-id="${esc(String(l.id||''))}" data-allow="1">
          <div class="ln"><span class="wo">${esc(l.allow)}</span><span class="tag">allowance</span>
          <button class="amdel" onclick="toggleRemove(this)" title="Remove">✕</button></div></div>`;
      }
      return `<div class="amendrow" data-id="${esc(String(l.id||''))}">
        <div class="ln">
          <input class="amwo" value="${esc(l.wo||'')}" placeholder="Work order">
          <input class="amhr" type="number" step="0.25" min="0" max="24" inputmode="decimal" value="${esc(l.hr!=null?l.hr:'')}">
          <button class="amdel" onclick="toggleRemove(this)" title="Remove line">✕</button>
        </div>
        <input class="amcomment" value="${esc(l.comment||'')}" placeholder="Comment (optional)">
        ${(l.jobs||[]).length?`<div class="lncomment">${jobTags(l).replace(/class="cotag"/g,'class="cotag" style="margin-left:0;margin-right:6px"')}</div>`:''}
      </div>`;
    }).join('');
    return `<div class="dayrow">${dayHead(d)}${lines}</div>`;
  }).join('');
  return `<div class="card amending" id="card-${esc(g.key)}">
    <div class="hd"><div><div class="who">${esc(g.name)} — amending</div>
      <div class="sub">${esc(g.site||'')}${g.weekStart?' · '+esc(weekRange(g.weekStart)):''}</div></div></div>
    ${contractNote(g)}
    <div class="meta" style="margin:2px 0 8px">Change the hours or work order, or tap ✕ to remove a line, then Save &amp; approve.</div>
    ${days}
    <div class="amnote">
      <label>Your note (optional)</label>
      <textarea class="amsupnote" rows="2" placeholder="e.g. Adjusted Tuesday to 8h per site log"></textarea>
    </div>
    <div class="acts">
      <button class="approve" onclick="saveAmend('${esc(g.key)}')">Save &amp; approve</button>
      <button class="reject" onclick="cancelAmend()">Cancel</button>
    </div>
  </div>`;
}
function startAmend(key){ AMEND_KEY=key; renderApprovals(); const c=document.getElementById('card-'+cssId(key)); if(c) c.scrollIntoView({block:'center'}); }
function cancelAmend(){ AMEND_KEY=null; renderApprovals(); }
function toggleRemove(btn){ const row=btn.closest('.amendrow'); if(row) row.classList.toggle('removed'); }
async function saveAmend(key){
  const g=GROUPS.find(x=>x.key===key); if(!g) return;
  const card=document.getElementById('card-'+cssId(key)); if(!card) return;
  const edits={}; const removedIds=[];
  card.querySelectorAll('.amendrow').forEach(row=>{
    const id=row.getAttribute('data-id'); if(!id) return;
    if(row.classList.contains('removed')){ removedIds.push(id); return; }
    if(row.getAttribute('data-allow')) return;             // allowance line kept as-is
    const wo=row.querySelector('.amwo'), hr=row.querySelector('.amhr'), cmt=row.querySelector('.amcomment');
    edits[id]={ hr: hr?hr.value:'', wo: wo?wo.value:'', comment: cmt?cmt.value:'' };
  });
  const noteEl=card.querySelector('.amsupnote'); const note=noteEl?noteEl.value.trim():'';
  if(!confirm('Save your changes and approve '+g.name+'’s timesheet?')) return;
  const btns=card.querySelectorAll('.acts button'); btns.forEach(b=>b.disabled=true);
  try{
    const res=await api('/.netlify/functions/amend',{ ids:g.ids, edits, removedIds, note });
    if(res.status===401){ toast('Please sign in again'); btns.forEach(b=>b.disabled=false); return; }
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'save');
    AMEND_KEY=null;
    const rm=data.removed?(' · '+data.removed+' line'+(data.removed===1?'':'s')+' removed'):'';
    if(data.held){ toast(`Saved — ${g.name}’s week is ${fmtHr(data.overBy)} over contract, sent to the senior approver${rm}`); await loadPending(); return; }
    GROUPS=GROUPS.filter(x=>x.key!==key);
    renderApprovals();
    toast('Amended & approved '+g.name+rm);
  }catch(e){ toast('Couldn’t save — '+((e&&e.message)||'try again')); btns.forEach(b=>b.disabled=false); }
}

/* ---------- manage work orders (per the supervisor's sites) ---------- */
let WO = { sites:[], workOrders:[] };
function woInId(site){ return 'woin_'+String(site).replace(/[^a-z0-9]/gi,'_'); }
async function loadWorkOrders(){
  document.getElementById('head').innerHTML=`<div class="sh">Work orders</div><div class="meta">Add or remove the jobs that appear in the timesheet apps for your sites.</div>`;
  document.getElementById('cards').innerHTML='<div class="loading">Loading…</div>';
  try{
    const res=await api('/.netlify/functions/workorders',{ action:'list' });
    if(res.status===401){ toast('Please sign in again'); return; }
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'load');
    WO=data; renderWorkOrders();
  }catch(e){ document.getElementById('cards').innerHTML='<div class="empty"><div class="big">⚠️</div>Couldn’t load work orders — '+esc((e&&e.message)||'try again')+'</div>'; }
}
function renderWorkOrders(){
  const bySite={};
  (WO.sites||[]).forEach(s=>bySite[s]=[]);
  (WO.workOrders||[]).forEach(w=>{ (bySite[w.site]=bySite[w.site]||[]).push(w); });
  let html=(WO.sites||[]).map(site=>{
    const rows=(bySite[site]||[]).map(w=>`<div class="worow"><span>${esc(w.title)}</span><button class="wodel" onclick="removeWO('${esc(String(w.id))}')" title="Remove">✕</button></div>`).join('')
      || '<div class="meta" style="padding:5px 0 2px">No work orders yet.</div>';
    return `<div class="card"><div class="who">${esc(site)}</div>${rows}
      <div class="woadd-lbl">Add work orders <span>— one per line</span></div>
      <textarea id="${woInId(site)}" class="wota" rows="3" placeholder="WO-1234 — description&#10;WO-5678 — description"></textarea></div>`;
  }).join('');
  html+=`<button class="payrollbtn" id="woSaveBtn" onclick="saveWorkOrders()">＋ Save new work orders</button>`;
  html+=`<button class="payrollbtn" style="margin-top:8px;border-color:var(--line);color:var(--muted)" onclick="loadPending()">← Back to approvals</button>`;
  document.getElementById('cards').innerHTML=html;
}
async function saveWorkOrders(){
  const items=[];
  (WO.sites||[]).forEach(site=>{
    const ta=document.getElementById(woInId(site));
    if(!ta) return;
    ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach(title=>items.push({site,title}));
  });
  if(!items.length){ toast('Type some work orders first — one per line.'); return; }
  const btn=document.getElementById('woSaveBtn'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{
    const res=await api('/.netlify/functions/workorders',{ action:'addmany', items });
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'save');
    toast('Added '+data.created+' work order'+(data.created===1?'':'s'));
    loadWorkOrders();
  }catch(e){ toast('Couldn’t save — '+((e&&e.message)||'try again')); if(btn){ btn.disabled=false; btn.textContent='＋ Save new work orders'; } }
}
async function removeWO(id){
  if(!confirm('Remove this work order from the list?')) return;
  try{
    const res=await api('/.netlify/functions/workorders',{ action:'remove', id });
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'remove');
    toast('Removed'); loadWorkOrders();
  }catch(e){ toast('Couldn’t remove — '+((e&&e.message)||'try again')); }
}

/* ---------- manage contractors + their access codes ---------- */
let CONTRACTORS=[];
async function loadContractors(){
  document.getElementById('head').innerHTML=`<div class="sh">Contractors</div><div class="meta">Add a contractor and give them their access code for the green app. Codes are created automatically.</div>`;
  document.getElementById('cards').innerHTML='<div class="loading">Loading…</div>';
  try{
    const res=await api('/.netlify/functions/contractors',{ action:'list' });
    if(res.status===401){ toast('Please sign in again'); return; }
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'load');
    CONTRACTORS=data.contractors||[]; renderContractors();
  }catch(e){ document.getElementById('cards').innerHTML='<div class="empty"><div class="big">⚠️</div>Couldn’t load contractors — '+esc((e&&e.message)||'try again')+'</div>'; }
}
function renderContractors(){
  const rows=(CONTRACTORS||[]).map(c=>`
    <div class="crow${c.active?'':' off'}">
      <div class="cmain">
        <div class="cname">${esc(c.name||'—')}${c.active?'':' <span class="cinactive">inactive</span>'}</div>
        <div class="ccode"><span class="code" onclick="copyCode('${esc(c.code)}')" title="Tap to copy">${esc(c.code||'—')}</span></div>
      </div>
      <div class="cbtns">
        <button class="cbtn" onclick="regenCode('${esc(String(c.id))}','${esc(c.name)}')" title="New code">↻ New code</button>
        <button class="cbtn" onclick="setContractorActive('${esc(String(c.id))}',${c.active?'false':'true'})">${c.active?'Deactivate':'Reactivate'}</button>
      </div>
    </div>`).join('') || '<div class="meta" style="padding:6px 0">No contractors yet — add the first one below.</div>';
  let html=`<div class="card">
    <div class="who">Add a contractor</div>
    <div class="caddrow">
      <input id="cNewName" class="amwo" placeholder="Full name" style="flex:1">
      <button class="cbtn add" id="cAddBtn" onclick="addContractor()">＋ Add</button>
    </div>
    <div class="meta" style="margin-top:4px">A unique access code is generated automatically.</div>
  </div>
  <div class="card"><div class="who">Contractors</div>${rows}</div>`;
  html+=`<button class="payrollbtn" style="margin-top:8px;border-color:var(--line);color:var(--muted)" onclick="loadPending()">← Back to approvals</button>`;
  document.getElementById('cards').innerHTML=html;
}
async function addContractor(){
  const el=document.getElementById('cNewName'); const name=(el?el.value:'').trim();
  if(!name){ toast('Type the contractor’s name first.'); return; }
  const btn=document.getElementById('cAddBtn'); if(btn){ btn.disabled=true; btn.textContent='Adding…'; }
  try{
    const res=await api('/.netlify/functions/contractors',{ action:'add', name });
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'add');
    toast('Added '+data.name+' · code '+data.code);
    alert(data.name+'’s access code is:\n\n'+data.code+'\n\nGive this to them for the green timesheet app. You can see it again on this screen.');
    loadContractors();
  }catch(e){ toast('Couldn’t add — '+((e&&e.message)||'try again')); if(btn){ btn.disabled=false; btn.textContent='＋ Add'; } }
}
async function regenCode(id,name){
  if(!confirm('Issue a NEW access code for '+(name||'this contractor')+'? Their old code stops working straight away.')) return;
  try{
    const res=await api('/.netlify/functions/contractors',{ action:'regen', id });
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'regen');
    toast('New code: '+data.code);
    alert((name||'The contractor')+'’s new access code is:\n\n'+data.code+'\n\nGive them this — the old one no longer works.');
    loadContractors();
  }catch(e){ toast('Couldn’t change code — '+((e&&e.message)||'try again')); }
}
async function setContractorActive(id,active){
  const on=(active===true||active==='true');
  if(!on && !confirm('Deactivate this contractor? Their code stops working until you reactivate them.')) return;
  try{
    const res=await api('/.netlify/functions/contractors',{ action:'setactive', id, active:on });
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'update');
    toast(on?'Reactivated':'Deactivated'); loadContractors();
  }catch(e){ toast('Couldn’t update — '+((e&&e.message)||'try again')); }
}
function copyCode(code){
  if(!code) return;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(()=>toast('Code '+code+' copied')).catch(()=>toast(code)); }
  else toast(code);
}

async function sendPayroll(which){
  which = which==='current' ? 'current' : 'last';
  const label = which==='current' ? 'THIS week so far' : 'last week';
  if(!confirm('Email '+label+'’s APPROVED hours to payroll for your site(s)? The supervisor is cc’d.')) return;
  const btn=document.querySelector('.payrollbtn'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  try{
    const res=await api('/.netlify/functions/report',{ which });
    if(res.status===401){ toast('Please sign in again'); return; }
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'failed');
    const sent=(data.results||[]).filter(r=>r.sent);
    const none=(data.results||[]).filter(r=>!r.sent);
    if(sent.length){
      toast('Sent to payroll: '+sent.map(r=>`${r.site} (${r.total}h)`).join(', ')+(none.length?' · nothing approved for '+none.map(r=>r.site).join(', '):''));
    } else {
      toast('No approved hours found for last week.');
    }
  }catch(e){ toast('Couldn’t send — '+((e&&e.message)||'try again')); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='📧 Email last week’s payroll report'; } }
}

async function decide(key, action){
  const g=GROUPS.find(x=>x.key===key);
  if(!g) return;
  let reason='';
  if(action==='reject'){
    reason=(prompt('Reason for rejecting '+g.name+'’s timesheet?')||'').trim();
    if(!reason){ return; }
  }
  const card=document.getElementById('card-'+cssId(key));
  const btns=card?card.querySelectorAll('button'):[];
  btns.forEach(b=>b.disabled=true);
  try{
    const res=await api('/.netlify/functions/decide',{ ids:g.ids, action, reason });
    if(res.status===401){ toast('Please sign in again'); btns.forEach(b=>b.disabled=false); return; }
    const data=await res.json();
    if(!data.ok){ if(data.error && res.status===400){ toast(data.error); btns.forEach(b=>b.disabled=false); return; } throw new Error('decide'); }
    if(data.held){ toast(`OK’d — ${g.name}’s week is ${fmtHr(data.overBy)} over contract, sent to the senior approver`); await loadPending(); return; }
    GROUPS=GROUPS.filter(x=>x.key!==key);
    renderApprovals();
    const by=userEmail?(' · by '+userEmail):'';
    toast(action==='approve'?`Approved ${g.name} — ${data.updated} ${data.updated===1?'entry':'entries'}${by}`:`Rejected ${g.name}${by}`);
  }catch(e){ toast('Couldn’t save — check signal and try again'); btns.forEach(b=>b.disabled=false); }
}
function cssId(key){ return String(key).replace(/"/g,'&quot;'); }

/* ---- payroll countdown: time until the next per-site report is emailed to accounts ---- */
let CD_TARGET=null;
function setCountdown(target){ CD_TARGET=target?new Date(target):null; tickCountdown(); }
function tickCountdown(){
  const el=document.getElementById('cdval'), bar=document.getElementById('cdbar');
  if(!bar||!el) return;
  if(!CD_TARGET || isNaN(CD_TARGET.getTime())){ bar.style.display='none'; return; }
  let ms=CD_TARGET.getTime()-Date.now(); if(ms<0) ms=0;
  const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000);
  el.textContent=d+'d '+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m';
  bar.style.display='';
}
setInterval(tickCountdown,30000);

/* Version badge (shown on every screen) + always-check-for-updates on load */
const APP_VERSION='4.6';
document.getElementById('verbadge').textContent='v'+APP_VERSION;
document.getElementById('signinVer').textContent='Version '+APP_VERSION;

/* Warn (in-app) before the Microsoft client secret expires, so whoever's here
   knows to renew it. Reads SUP_CONFIG.secretExpiry; links to the how-to page. */
function checkSecretExpiry(){
  const exp=(window.SUP_CONFIG||{}).secretExpiry; if(!exp) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const days=Math.round((new Date(exp+'T00:00:00')-today)/86400000);
  if(days>30) return;
  const bar=document.getElementById('expiryBar'); if(!bar) return;
  bar.classList.remove('hidden');
  if(days<0){
    bar.classList.add('urgent');
    bar.innerHTML='⚠️ The system security key EXPIRED on '+exp+' — the timesheet apps can’t reach SharePoint. <a href="renew-secret.html" target="_blank" rel="noopener">How to fix it →</a>';
  } else {
    bar.classList.toggle('urgent', days<=7);
    bar.innerHTML='⚠️ System security key expires '+exp+' (in '+days+' day'+(days===1?'':'s')+'). It must be renewed or the timesheet apps will stop working. <a href="renew-secret.html" target="_blank" rel="noopener">How to renew →</a>';
  }
}
checkSecretExpiry();
if('serviceWorker' in navigator && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
  navigator.serviceWorker.register('sw.js').then(reg=>{ try{ reg.update(); }catch(e){} }).catch(()=>{});
}
